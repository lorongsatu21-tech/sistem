<style>

<script>
/* ================= KONFIGURASI (sama dengan aplikasi Keuangan, satu Spreadsheet) ================= */
const OAUTH_CLIENT_ID = "161910278592-4g8h4oi240lg88hkjlm0ja8nl7jnq53v.apps.googleusercontent.com";
const SPREADSHEET_ID = "1bAS8NIzcSSENH5o9MSucaINMURUcwXFCRln0w4_g23A";
const OAUTH_SCOPE = "https://www.googleapis.com/auth/spreadsheets";

const SHEET_UNIT="Unit", SHEET_KAS_MASUK="Kas Masuk", SHEET_PEMASUKAN_LAIN="Pemasukan Lain", SHEET_TARGET_OMZET="Target Omzet";
const SHEET_KARYAWAN="Karyawan", SHEET_GAJI="Gaji", SHEET_BONUS="Bonus", SHEET_TARIF_JABATAN="Tarif Jabatan", SHEET_PLAFON_GAJI="Plafon Gaji";
const HDR_KARYAWAN=["ID Karyawan","Nama","Unit","Jabatan","Gaji Pokok","Gaji Awal","Status","No HP",
  "NIK","Tempat Lahir","Tanggal Lahir","Jenis Kelamin","Alamat","Akun Medsos",
  "Tanggal Mulai Kerja","Jenis Karyawan","Level Kompetensi","Ikut Bonus",
  "Nama Orang Tua","Jumlah Saudara","Kontak Darurat Nama","Kontak Darurat HP","Kontak Darurat Hubungan",
  "Pendidikan Terakhir","Tahun Lulus","Pengalaman Kerja","Masa Kerja Sebelumnya","Catatan","Next ID Counter"];
const HDR_GAJI=["Tanggal Bayar","Karyawan","Bulan","Jumlah","Tunjangan Jabatan","Keterangan"];
const HDR_BONUS=["Tanggal Bayar","Karyawan","Unit","Bulan","Jumlah"];
const HDR_TARIF_JABATAN=["Urutan","Jabatan","Kelipatan","Nilai Basis"];
const HDR_PLAFON_GAJI=["Tahun","Plafon","Total Gaji Pokok Saat Itu","Tanggal Dicatat","Bulan Terendah 1","Bulan Terendah 2","Bulan Terendah 3","Rata Alokasi Operasional"];
const MONTH_NAMES=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function asText(v){ return "'"+v; }

/* ================= AUTH GOOGLE (sama seperti Keuangan) ================= */
let googleAccessToken=null, googleTokenClient=null, signedInEmail=null, isSignedIn=false, triedSilentLogin=false;
function waitForGoogleGis(timeoutMs){
  return new Promise((resolve)=>{
    const started=Date.now();
    (function check(){
      if(window.google && google.accounts && google.accounts.oauth2){ resolve(true); return; }
      if(Date.now()-started>(timeoutMs||8000)){ resolve(false); return; }
      setTimeout(check,100);
    })();
  });
}
async function initGoogleAuth(){
  const ready=await waitForGoogleGis(8000);
  if(!ready){ console.error("Script Google Identity Services tidak kunjung siap."); return false; }
  try{
    googleTokenClient=google.accounts.oauth2.initTokenClient({ client_id:OAUTH_CLIENT_ID, scope:OAUTH_SCOPE, callback:()=>{} });
    return true;
  }catch(e){ console.error("Gagal init Google Auth:",e); return false; }
}
function requestGoogleSignIn(prompt){
  return new Promise((resolve)=>{
    googleTokenClient.callback=(tokenResponse)=>{
      if(tokenResponse && tokenResponse.access_token){
        googleAccessToken=tokenResponse.access_token; isSignedIn=true;
        fetchSignedInEmail().finally(()=>resolve(true));
      } else { resolve(false); }
    };
    googleTokenClient.error_callback=()=>resolve(false);
    googleTokenClient.requestAccessToken({ prompt: prompt||"" });
  });
}
async function fetchSignedInEmail(){
  try{
    const res=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{ headers:{ Authorization:`Bearer ${googleAccessToken}` } });
    if(!res.ok) return;
    const info=await res.json(); signedInEmail=info.email||null;
  }catch(e){}
}
function googleSignOut(){
  if(googleAccessToken && window.google && google.accounts && google.accounts.oauth2){ google.accounts.oauth2.revoke(googleAccessToken, ()=>{}); }
  googleAccessToken=null; signedInEmail=null; isSignedIn=false;
  location.reload();
}

/* ================= SHEETS API v4 (sama seperti Keuangan) ================= */
async function sheetsApiFetch(path, options){
  const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}${path}`,{
    ...options, headers:{ "Authorization":`Bearer ${googleAccessToken}`, "Content-Type":"application/json", ...(options&&options.headers) }
  });
  if(res.status===401){
    const ok=await requestGoogleSignIn("");
    if(ok){
      return fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}${path}`,{
        ...options, headers:{ "Authorization":`Bearer ${googleAccessToken}`, "Content-Type":"application/json", ...(options&&options.headers) }
      });
    }
  }
  return res;
}
let sheetTitlesCache=null;
async function ensureSheetExists(sheetName){
  try{
    if(!sheetTitlesCache){
      const res=await sheetsApiFetch(`?fields=sheets.properties.title`,{method:"GET"});
      if(res.ok){ const data=await res.json(); sheetTitlesCache=(data.sheets||[]).map(s=>s.properties.title); }
      else { sheetTitlesCache=[]; }
    }
    if(sheetTitlesCache.includes(sheetName)) return true;
    const addRes=await sheetsApiFetch(`:batchUpdate`,{ method:"POST", body:JSON.stringify({ requests:[{ addSheet:{ properties:{ title:sheetName } } }] }) });
    if(addRes.ok){ sheetTitlesCache.push(sheetName); return true; }
    if(addRes.status===400){ sheetTitlesCache=null; return true; }
    return false;
  }catch(e){ console.error("Gagal memastikan tab sheet ada:",sheetName,e); return false; }
}
function rowsToGrid(headers,rowObjects){
  return rowObjects.map(r=>headers.map(h=>{ let v=r[h]; if(v===undefined||v===null) v=""; if(typeof v==="string"&&v.startsWith("'")) v=v.slice(1); return v; }));
}
function gridToRows(values){
  if(!values||values.length<1) return [];
  const headers=values[0];
  return values.slice(1).map(row=>{ const o={}; headers.forEach((h,i)=>{ o[h]=row[i]!==undefined?row[i]:""; }); return o; });
}
async function sheetsGetAll(sheetName){
  const attempts=3;
  for(let i=0;i<attempts;i++){
    try{
      const res=await sheetsApiFetch(`/values/${encodeURIComponent(sheetName)}`,{method:"GET"});
      if(res.status===400){ return []; }
      if(!res.ok){ throw new Error(`HTTP ${res.status}`); }
      const data=await res.json();
      return gridToRows(data.values||[]);
    }catch(e){
      if(i===attempts-1){ console.error(`Gagal memuat sheet "${sheetName}":`,e); return null; }
      await new Promise(r=>setTimeout(r,500*(i+1)));
    }
  }
}
async function sheetsReplaceAll(sheetName,headers,rows){
  const attempts=3;
  const grid=[headers, ...rowsToGrid(headers,rows)];
  for(let i=0;i<attempts;i++){
    try{
      const exists=await ensureSheetExists(sheetName);
      if(!exists) throw new Error(`Gagal memastikan/membuat tab "${sheetName}"`);
      const clearRes=await sheetsApiFetch(`/values/${encodeURIComponent(sheetName)}:clear`,{method:"POST",body:"{}"});
      if(!clearRes.ok) throw new Error(`Gagal clear (HTTP ${clearRes.status})`);
      const updateRes=await sheetsApiFetch(`/values/${encodeURIComponent(sheetName)}?valueInputOption=USER_ENTERED`,{
        method:"PUT", body:JSON.stringify({ range:sheetName, majorDimension:"ROWS", values:grid })
      });
      if(!updateRes.ok) throw new Error(`Gagal update (HTTP ${updateRes.status})`);
      return true;
    }catch(e){
      if(i===attempts-1){ console.error(`Gagal menyimpan sheet "${sheetName}":`,e); return false; }
      await new Promise(r=>setTimeout(r,500*(i+1)));
    }
  }
}

  return null;
}

function masaKerjaBulanCount(tanggalMulai){
  if(!tanggalMulai) return 0;
  const mulai=new Date(tanggalMulai+"T00:00:00"); const now=new Date();
  if(isNaN(mulai.getTime()) || mulai>now) return 0;
  let bulan=(now.getFullYear()-mulai.getFullYear())*12 + (now.getMonth()-mulai.getMonth());
  if(now.getDate()<mulai.getDate()) bulan--;
  return Math.max(0, bulan);
}
// Pola kenaikan gaji tahunan: tahun ke-1,2 naik 100; tahun ke-3 naik 200; berulang tiap 3 tahun
function kenaikanPolaTahunKe(tahunKe){ return (tahunKe % 3 === 0) ? 200 : 100; }
function totalKenaikanPola(tahunPenuh){
  let total=0; for(let t=1;t<=tahunPenuh;t++){ total+=kenaikanPolaTahunKe(t); }
  return total;
}
function gajiPokokSesuaiPola(k){
  const gajiAwal = k.gajiAwal||k.gajiPokok||0;
  const bulanKerja = masaKerjaBulanCount(k.tanggalMulaiKerja);
  const tahunPenuh = Math.floor(bulanKerja/12);
  return gajiAwal + totalKenaikanPola(tahunPenuh);
}
function masaKerjaText(tanggalMulai){
  if(!tanggalMulai) return "-";
  const mulai=new Date(tanggalMulai+"T00:00:00"); const now=new Date();
  if(isNaN(mulai.getTime()) || mulai>now) return "-";
  let bulan=(now.getFullYear()-mulai.getFullYear())*12 + (now.getMonth()-mulai.getMonth());
  if(now.getDate()<mulai.getDate()) bulan--;
  if(bulan<0) bulan=0;
  const th=Math.floor(bulan/12), bl=bulan%12;
  if(th<=0 && bl<=0) return "Baru mulai";
  const parts=[]; if(th>0) parts.push(`${th} tahun`); if(bl>0) parts.push(`${bl} bulan`);
  return parts.join(" ");
}

/* ================= REALISASI OMZET & BONUS (logika sama dengan aplikasi Keuangan) ================= */
const FAKTOR_RIBUAN = 1000; // seluruh data di aplikasi (Keuangan & Karyawan) tersimpan dalam notasi ribuan; hanya Struk Gaji yang menampilkan nilai riil (x1000)
function realisasiOmzetForMonth(unitKey, year, m){
  const {from,to}=monthRange(year,m);
  let total=0;
  const byLabel=unitByLabelMap(UNITS);
  PEMASUKAN_RAW.forEach(r=>{
    const dt=normalizeDateCell(r["Tanggal"]); if(!dt||dt<from||dt>to) return;
    const rowUnitKey=byLabel[normalizeJabatanName(r["Unit"])];
    if(unitKey && rowUnitKey!==unitKey) return;
    const kas=(Number(r["Kas Pagi"])||0)+(Number(r["Kas Sore"])||0)+(Number(r["Transfer Pagi"])||0)+(Number(r["Transfer Sore"])||0);
    total+=kas;
  });
  PEMASUKAN_LAIN_RAW.forEach(r=>{
    const dt=normalizeDateCell(r["Tanggal"]); if(!dt||dt<from||dt>to) return;
    const rowUnitKey=byLabel[normalizeJabatanName(r["Unit"])];
    if(unitKey && rowUnitKey!==unitKey) return;
    total+=Number(r["Jumlah"])||0;
  });
  return total;
}
function findUnitByNamaMirip(namaCari){
  const target=normalizeJabatanName(namaCari);
  return UNITS.find(u=>normalizeJabatanName(u.label)===target || normalizeJabatanName(u.label).includes(target));
}
function unitsInSelection(selectedUnitKey){
  if(selectedUnitKey==="__LAINNYA__"){
    const utama=findUnitByNamaMirip("Lorongsatu21");
    return UNITS.filter(u=>!utama||u.key!==utama.key).map(u=>u.key);
  }
  if(!selectedUnitKey) return UNITS.map(u=>u.key); // Semua Unit
  return [selectedUnitKey];
}
function computeBonusPool(unitKey, year, m){
  const ym=`${year}-${String(m).padStart(2,"0")}`;

  // 1) Hitung dulu Total Bonus Keseluruhan (semua unit digabung jadi satu, ini basis utamanya)
  const totalTarget=(TARGET_OMZET[""]&&TARGET_OMZET[""][ym])||0;
  const totalRealisasi=realisasiOmzetForMonth("",year,m);
  let totalPct=null, totalBonusPct=0, totalBonusPool=0;
  if(totalTarget>0){
    totalPct=totalRealisasi/totalTarget*100;
    if(totalPct>=100) totalBonusPct=1; else if(totalPct>=90) totalBonusPct=0.5;
    totalBonusPool=Math.round(totalRealisasi*totalBonusPct/100);
  }

  // 2) Tentukan realisasi & target kelompok yang dipilih (buat info/tampilan porsi)
  const keys=unitsInSelection(unitKey); // "" -> semua unit, "__LAINNYA__" -> semua kecuali Lorongsatu21, dll
  const groupRealisasi=keys.reduce((s,uk)=>s+realisasiOmzetForMonth(uk,year,m),0);
  const groupTarget=keys.reduce((s,uk)=>s+((TARGET_OMZET[uk]&&TARGET_OMZET[uk][ym])||0),0);
  const groupPct=groupTarget>0 ? groupRealisasi/groupTarget*100 : null;

  // 3) Porsi bonus kelompok ini = Total Bonus Keseluruhan x (porsi omzet kelompok ini dari omzet total)
  const porsi=totalRealisasi>0 ? groupRealisasi/totalRealisasi : 0;
  const bonusPool=Math.round(totalBonusPool*porsi);

  return {
    target:groupTarget, realisasi:groupRealisasi, pct:groupPct, bonusPct:totalBonusPct, bonusPool,
    totalTarget, totalRealisasi, totalPct, totalBonusPool, porsi
  };
}

const PORSI_GAJI_DARI_OPERASIONAL = 0.6; // 60% dari Kantong Operasional dialokasikan untuk Gaji Pokok
function hitungPlafonGaji(year){
  const byUnit=unitByLabelMap(UNITS);
  const monthly=[]; // [{m, omzet, operasional}]
  for(let m=1;m<=12;m++){
    const from=`${year}-${String(m).padStart(2,"0")}-01`;
    const lastDay=new Date(year,m,0).getDate();
    const to=`${year}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
    let omzet=0, operasional=0;
    PEMASUKAN_RAW.forEach(r=>{
      const dt=normalizeDateCell(r["Tanggal"]); if(!dt||dt<from||dt>to) return;
      omzet += (Number(r["Kas Pagi"])||0)+(Number(r["Kas Sore"])||0)+(Number(r["Transfer Pagi"])||0)+(Number(r["Transfer Sore"])||0);
      operasional += Number(r["Alokasi Operasional"])||0;
    });
    PEMASUKAN_LAIN_RAW.forEach(r=>{
      const dt=normalizeDateCell(r["Tanggal"]); if(!dt||dt<from||dt>to) return;
      omzet += Number(r["Jumlah"])||0;
    });
    monthly.push({ m, omzet, operasional });
  }
  const withData = monthly.filter(x=>x.omzet>0);
  if(withData.length<1) return null;
  const sorted=[...withData].sort((a,b)=>a.omzet-b.omzet);
  const terendah = sorted.slice(0, Math.min(3, sorted.length));
  const rataOperasional = Math.round(terendah.reduce((s,x)=>s+x.operasional,0)/terendah.length);
  const plafon = Math.round(rataOperasional * PORSI_GAJI_DARI_OPERASIONAL);
  return { bulanTerendah: terendah.map(x=>({ nama:MONTH_NAMES[x.m-1], omzet:x.omzet, operasional:x.operasional })), rataOperasional, plafon };
}

];
const PAGE_META={
  "sampul":["Sampul","LORONGSATU21 — Karyawan"],
  "dashboard":["Dashboard","Ringkasan karyawan dan pembayaran"],
  "daftar":["Daftar Karyawan","Kelola data karyawan per unit"],
  "dokumen":["Formulir & Surat","Formulir data karyawan baru dan surat pernyataan, siap diprint"],
  "gaji":["Gaji Bulanan","Catat pembayaran gaji tiap bulan"],
  "riwayatgaji":["Riwayat Gaji","Gaji awal, pola kenaikan tahunan, dan gaji saat ini per karyawan"],
  "bonus":["Bonus","Bonus karyawan berdasarkan pencapaian target omzet unit"],
  "tarif":["Tarif Jabatan","Urutan jabatan, kelipatan, dan nilai basis tunjangan"],
  "plafon":["Plafon Gaji","Batas total gaji pokok berdasarkan kemampuan usaha di bulan tersepi"],
  "struk":["Struk Gaji","Cetak struk gaji per karyawan, siap print"]
};
let currentPage="dashboard";
function buildNav(){
  const nav=document.getElementById("navContainer"); nav.innerHTML="";
  NAV.forEach(grp=>{
    const g=document.createElement("div"); g.className="navgroup";
    g.innerHTML=`<div class="navgroup-label">${grp.group}</div>`;
    grp.items.forEach(it=>{
      const a=document.createElement("a"); a.className="navlink"; a.href="javascript:void(0)"; a.dataset.id=it.id;
      a.innerHTML=`<span class="dot"></span>${it.label}`;
      a.addEventListener("click",(e)=>{ e.preventDefault(); navigateTo(it.id); });
      g.appendChild(a);
    });
    nav.appendChild(g);
  });
}
function setActiveNav(id){
  document.querySelectorAll(".navlink").forEach(a=>a.classList.toggle("active", a.dataset.id===id));
  const meta=PAGE_META[id]||["",""];
  document.getElementById("pageTitle").textContent=meta[0];
  document.getElementById("pageSubtitle").textContent=meta[1];
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("open");
  document.getElementById("appShell").classList.toggle("sampul-mode", id==="sampul");
}
function navigateTo(id){
  currentPage=id||"dashboard";
  setActiveNav(currentPage);
  const c=document.getElementById("pageContent");
  const renderers={ "sampul":renderSampul,"dashboard":renderDashboard,"daftar":renderDaftar,"dokumen":renderDokumen,"gaji":renderGaji,"riwayatgaji":renderRiwayatGaji,"bonus":renderBonus,"tarif":renderTarifJabatan,"plafon":renderPlafonGaji,"struk":renderStrukGaji };
  try{ (renderers[currentPage]||renderDashboard)(c); }
  catch(err){ console.error("Render error",currentPage,err); c.innerHTML=`<div class="empty-state">Terjadi kendala membuka halaman ini.</div>`; }
}

/* ================= SAMPUL ================= */
function renderSampul(c){
  c.innerHTML=`
    <div class="sampul-screen">
      <div class="sampul-top">
        <h1>LORONGSATU21</h1>
        <div class="sub1">Sistem Karyawan</div>
        <div class="sub2">${new Date().toLocaleDateString("id-ID",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}</div>
      </div>
      <div class="sampul-btn-wrap">
        <button class="btn-sampul" id="sampulMasuk">Masuk</button>
        <div id="sampulStatus" style="margin-top:14px;font-size:12px;color:#8fa5cc;text-align:center;min-height:16px;"></div>
      </div>
      <div class="sampul-footer">Data tersinkron dengan Sistem Keuangan</div>
    </div>`;
  document.getElementById("sampulMasuk").addEventListener("click", handleSampulMasuk);
}
async function handleSampulMasuk(){
  const btn=document.getElementById("sampulMasuk"); const status=document.getElementById("sampulStatus");
  if(isSignedIn){ navigateTo("dashboard"); return; }
  btn.disabled=true; btn.textContent="Menghubungkan...";
  status.textContent="Membuka jendela login Google...";
  const promptMode=triedSilentLogin?"consent":"";
  const ok=await requestGoogleSignIn(promptMode);
  triedSilentLogin=true;
  if(!ok){
    status.textContent = promptMode==="" ? "Perlu izin akses — klik Masuk sekali lagi." : "Login dibatalkan atau gagal. Coba lagi.";
    btn.disabled=false; btn.textContent="Masuk";
    return;
  }
  status.textContent="Memuat data...";
  await loadAppData();
  navigateTo("dashboard");
}

/* ================= DASHBOARD ================= */
function renderDashboard(c){
  const aktif=KARYAWAN.filter(k=>k.status==="aktif");
  const now=new Date(); const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const gajiBulanIni=GAJI.filter(g=>g.bulan===ym).reduce((s,g)=>s+g.jumlah,0);
  const bonusBulanIni=BONUS.filter(b=>b.bulan===ym).reduce((s,b)=>s+b.jumlah,0);
  const perUnit={}; UNITS.forEach(u=>perUnit[u.key]=0);
  aktif.forEach(k=>{ if(perUnit[k.unitKey]!==undefined) perUnit[k.unitKey]++; });

  c.innerHTML=`
    <div class="grid4" style="margin-bottom:20px;">
      <div class="stat-card"><div class="label">Karyawan Aktif</div><div class="value">${aktif.length}</div><div class="sub">dari ${KARYAWAN.length} total</div></div>
      <div class="stat-card c-blue"><div class="label">Gaji Bulan Ini</div><div class="value">${formatRupiah(gajiBulanIni)}</div><div class="sub">${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}</div></div>
      <div class="stat-card c-gold"><div class="label">Bonus Bulan Ini</div><div class="value">${formatRupiah(bonusBulanIni)}</div><div class="sub">seluruh unit</div></div>
      <div class="stat-card c-plum"><div class="label">Jumlah Unit</div><div class="value">${UNITS.length}</div><div class="sub">unit usaha</div></div>
    </div>
    <div class="section-title">Karyawan Aktif per Unit</div>
    <div class="grid2">${UNITS.map(u=>`
      <div class="card card-pad">
        <div style="font-weight:700;color:var(--moss-dark);margin-bottom:4px;">${escapeHtml(u.label)}</div>
        <div style="font-size:20px;font-weight:700;">${perUnit[u.key]||0} <span style="font-size:12px;font-weight:400;color:var(--muted);">karyawan aktif</span></div>
      </div>`).join("") || '<div class="empty-state">Belum ada unit — kelola unit lewat aplikasi Keuangan.</div>'}</div>
  `;
}

function cetakDetailKaryawan(k){
  const win = window.open('', '_blank');
  if(!win){ showToast('Popup diblokir browser — izinkan popup untuk mencetak'); return; }
  const NAVY='#0d2a52', GOLD='#a9843a', GOLDLIGHT='#c9a86a', MUTED='#8a8474', INK='#241f14', LINE='#d8cfb4';
  function field(label, value){
    return `<tr><td style="padding:5px 10px 5px 0;font-weight:700;font-size:9.5pt;color:${INK};white-space:nowrap;vertical-align:bottom;">${label}</td><td style="padding:5px 0;font-size:9.5pt;border-bottom:0.6pt solid ${LINE};width:100%;vertical-align:bottom;">${value||'&nbsp;'}</td></tr>`;
  }
  function section(title){
    return `<tr><td colspan="2" style="padding:0;">
      <table style="width:100%;margin:12px 0 6px;border-collapse:collapse;"><tr>
        <td style="width:3mm;background:${GOLD};padding:0;"></td>
        <td style="background:${NAVY};color:#fff;font-weight:700;font-size:10pt;padding:6px 10px;">${title}</td>
      </tr></table>
    </td></tr>`;
  }
  const tglLahirText = k.tanggalLahir ? k.tanggalLahir : '-';
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Data Karyawan - ${escapeHtml(k.nama)}</title>
  <style>
    @page{ margin:12mm 16mm; }
    body{ font-family: Helvetica, Arial, sans-serif; color:${INK}; margin:0; padding:8mm 4mm; }
    .eyebrow{ font-size:8.5pt; letter-spacing:0.14em; text-transform:uppercase; color:${GOLD}; font-weight:700; }
    h1{ font-size:15pt; color:${NAVY}; margin:4px 0 2px; }
    .sub{ font-size:9pt; color:${MUTED}; margin-bottom:4mm; }
    .rule{ width:34mm; height:0.9mm; background:${GOLD}; margin-bottom:5mm; }
    table.fields{ width:100%; border-collapse:collapse; }
    .frame{ border:0.9pt solid ${GOLDLIGHT}; padding:8mm; }
    @media print{ .noprint{ display:none; } }
  </style></head>
  <body>
    <div class="frame">
      <div class="eyebrow">LORONGSATU21</div>
      <h1>Data Karyawan — Arsip</h1>
      <div class="rule"></div>
      <div class="sub">ID Karyawan: <b>${escapeHtml(k.idKaryawan||'-')}</b> &nbsp;&middot;&nbsp; Dicetak ${new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}</div>
      <table class="fields">
        ${section('DATA DASAR')}
        ${field('Nama Lengkap', escapeHtml(k.nama))}
        ${field('Unit Penempatan', escapeHtml(unitLabel(k.unitKey)))}
        ${field('Jabatan', escapeHtml(k.jabatan||'Anggota Tim'))}
        ${field('Tanggal Mulai Kerja', k.tanggalMulaiKerja||'-')}
        ${field('No. HP', escapeHtml(k.noHp))}

        ${section('DATA PRIBADI')}
        ${field('NIK (No. KTP)', escapeHtml(k.nik))}
        ${field('Jenis Kelamin', escapeHtml(k.jenisKelamin))}
        ${field('Tempat, Tanggal Lahir', `${escapeHtml(k.tempatLahir)||'-'}, ${tglLahirText}`)}
        ${field('Akun Media Sosial', escapeHtml(k.medsos))}
        ${field('Alamat Lengkap', escapeHtml(k.alamat))}

        ${section('DATA KEPEGAWAIAN')}
        ${field('Jenis Karyawan', escapeHtml(k.jenisKaryawan))}
        ${field('Level Kompetensi', escapeHtml(k.levelKompetensi))}
        ${field('Masa Kerja', masaKerjaText(k.tanggalMulaiKerja))}

        ${section('RIWAYAT PENDIDIKAN &amp; KERJA')}
        ${field('Pendidikan Terakhir', escapeHtml(k.pendidikanTerakhir))}
        ${field('Tahun Lulus', escapeHtml(k.tahunLulus))}
        ${field('Pengalaman Kerja Sebelumnya', escapeHtml(k.pengalamanKerja))}
        ${field('Masa Kerja (di tempat sebelumnya)', escapeHtml(k.masaKerjaSebelumnya))}

        ${section('KELUARGA &amp; KONTAK DARURAT')}
        ${field('Nama Orang Tua/Wali', escapeHtml(k.namaOrangTua))}
        ${field('Jumlah Saudara Kandung', escapeHtml(k.jumlahSaudara))}
        ${field('Nama Kontak Darurat', escapeHtml(k.kontakDaruratNama))}
        ${field('No. HP Kontak Darurat', escapeHtml(k.kontakDaruratHp))}
        ${field('Hubungan', escapeHtml(k.kontakDaruratHubungan))}

        ${section('CATATAN')}
        ${field('Catatan', escapeHtml(k.catatan))}
      </table>
    </div>
    <div class="noprint" style="text-align:center;margin-top:6mm;">
      <button onclick="window.print()" style="padding:8px 18px;background:${NAVY};color:#fff;border:none;border-radius:6px;font-size:10pt;cursor:pointer;">🖨️ Print / Simpan sebagai PDF</button>
    </div>
  </body></html>`;
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(()=>{ try{ win.print(); }catch(e){} }, 350);
}

function openDetailModal(karyawanId, onSaved){
  const isNew = !karyawanId;
  const k = isNew ? { id:uid(), nama:"", unitKey:"", jabatan:"", gajiPokok:0, status:"aktif", noHp:"" } : KARYAWAN.find(x=>x.id===karyawanId);
  if(!k) return;
  const overlay=document.createElement("div"); overlay.className="modal-overlay";
  const box=document.createElement("div"); box.className="modal-box elegant"; box.style.maxWidth="600px"; box.style.maxHeight="85vh"; box.style.overflowY="auto";

  function field(label, key, type){
    const val=escapeHtml(k[key]||"");
    if(type==="date") return `<div class="field-inline"><label class="f-label">${label}</label><input type="date" data-detail-field="${key}" value="${val}"></div>`;
    if(type==="textarea") return `<div class="field-inline" style="grid-column:1/-1;"><label class="f-label">${label}</label><textarea data-detail-field="${key}" rows="2" style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;font-family:inherit;">${val}</textarea></div>`;
    return `<div class="field-inline"><label class="f-label">${label}</label><input type="text" data-detail-field="${key}" value="${val}"></div>`;
  }
  function selectField(label, key, options){
    return `<div class="field-inline"><label class="f-label">${label}</label><select data-detail-field="${key}">
      <option value="">- Pilih -</option>${options.map(o=>`<option value="${o}" ${k[key]===o?"selected":""}>${o}</option>`).join("")}
    </select></div>`;
  }
  function unitSelectField(){
    return `<div class="field-inline"><label class="f-label">Unit</label><select data-detail-field="unitKey">
      <option value="">- Pilih Unit -</option>${UNITS.map(u=>`<option value="${u.key}" ${k.unitKey===u.key?"selected":""}>${escapeHtml(u.label)}</option>`).join("")}
    </select></div>`;
  }
  function jabatanSelectField(){
    const opts = TARIF_JABATAN.map(t=>t.nama);
    const kJabatanNorm = normalizeJabatanName(k.jabatan);
    const matchedCanonical = opts.find(o=>normalizeJabatanName(o)===kJabatanNorm);
    if(k.jabatan && !matchedCanonical) opts.push(k.jabatan); // jaga data lama yang benar2 belum ada di daftar tarif
    const currentValue = matchedCanonical || k.jabatan || "";
    return `<div class="field-inline"><label class="f-label">Jabatan</label><select data-detail-field="jabatan">
      <option value="">Tanpa Jabatan (Anggota Tim)</option>
      ${opts.map(o=>`<option value="${escapeHtml(o)}" ${currentValue===o?"selected":""}>${escapeHtml(o)}</option>`).join("")}
    </select>${!TARIF_JABATAN.length?'<div style="font-size:11px;color:var(--muted);margin-top:3px;">Daftar kosong — atur dulu lewat menu Tarif Jabatan.</div>':''}</div>`;
  }
  function moneyField(label, key){
    return `<div class="field-inline"><label class="f-label">${label}</label><div class="input-money"><span>Rp</span><input type="text" inputmode="numeric" class="money" data-detail-field="${key}" data-money="1" value="${k[key]?k[key].toLocaleString('id-ID'):''}"></div></div>`;
  }

  const idSuggestion = isNew ? formatIdKaryawan(NEXT_KARYAWAN_ID) : (k.idKaryawan||"");
  box.innerHTML=`
    <div class="modal-header-elegant">
      <div class="eyebrow-x">Lorongsatu21</div>
      <h3>${isNew?"Formulir Karyawan Baru":escapeHtml(k.nama)}</h3>
      <div class="gold-rule"></div>
    </div>

    <div class="section-title-elegant">Data Dasar</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      <div class="field-inline"><label class="f-label">ID Karyawan</label><input type="text" id="dtIdKaryawan" value="${escapeHtml(idSuggestion)}" placeholder="mis. 017" maxlength="3" style="max-width:100px;">
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px;">${isNew?'Usulan otomatis — boleh diganti kalau ini karyawan lama dengan nomor tertentu':'Boleh diedit kalau perlu koreksi'}</div>
      </div>
      ${field("Nama Lengkap","nama")}
      ${unitSelectField()}
      ${jabatanSelectField()}
      ${moneyField("Gaji Pokok (notasi ribuan)","gajiPokok")}
      ${field("No HP","noHp")}
    </div>

    <div class="section-title-elegant">Data Pribadi</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      ${field("NIK","nik")}
      ${selectField("Jenis Kelamin","jenisKelamin",["Laki-laki","Perempuan"])}
      ${field("Tempat Lahir","tempatLahir")}
      ${field("Tanggal Lahir","tanggalLahir","date")}
      ${field("Akun Medsos","medsos")}
      ${field("Alamat Lengkap","alamat","textarea")}
    </div>

    <div class="section-title-elegant">Data Kepegawaian <span class="tag">diisi oleh Perusahaan</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      ${field("Tanggal Mulai Kerja","tanggalMulaiKerja","date")}
      <div class="field-inline"><label class="f-label">Masa Kerja</label><div style="padding:8px 0;font-size:13.5px;font-weight:600;color:var(--moss-dark);" id="dtMasaKerja">${masaKerjaText(k.tanggalMulaiKerja)}</div></div>
      ${selectField("Jenis Karyawan","jenisKaryawan",["Tetap","Kontrak","Harian","Paruh Waktu"])}
      ${selectField("Level Kompetensi","levelKompetensi",["1","2","3","4","5"])}
      <div class="field-inline">
        <label class="f-label">Ikut Pembagian Bonus</label>
        <select data-detail-field-bool="ikutBonus">
          <option value="ya" ${k.ikutBonus!==false?"selected":""}>Ya</option>
          <option value="tidak" ${k.ikutBonus===false?"selected":""}>Tidak (mis. Owner/Admin)</option>
        </select>
        <div style="font-size:10px;color:var(--muted);margin-top:2px;">Kalau "Tidak", karyawan ini tidak akan muncul di halaman Bonus</div>
      </div>
    </div>

    <div class="section-title-elegant">Riwayat Pendidikan & Kerja</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      ${selectField("Pendidikan Terakhir","pendidikanTerakhir",["SD","SMP","SMA/SMK","D3","S1","S2"])}
      ${field("Tahun Lulus","tahunLulus")}
      ${field("Pengalaman Kerja Sebelumnya","pengalamanKerja","textarea")}
      ${field("Masa Kerja (di tempat sebelumnya)","masaKerjaSebelumnya")}
    </div>

    <div class="section-title-elegant">Keluarga & Kontak Darurat</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      ${field("Nama Orang Tua/Wali","namaOrangTua")}
      ${field("Jumlah Saudara Kandung","jumlahSaudara")}
      ${field("Nama Kontak Darurat","kontakDaruratNama")}
      ${field("No HP Kontak Darurat","kontakDaruratHp")}
      ${field("Hubungan","kontakDaruratHubungan")}
    </div>

    <div class="section-title-elegant">Catatan Tambahan</div>
    <div style="margin-bottom:16px;">${field("Catatan","catatan","textarea")}</div>

    <div class="modal-actions" style="border-top:1px solid #e8e2cc;padding-top:16px;margin-top:4px;">
      ${!isNew?`<button class="btn btn-ghost" data-act="cetak">🖨️ Cetak / Simpan PDF</button>`:''}
      <button class="btn btn-ghost" data-act="cancel">Batal</button>
      <button class="btn btn-primary" data-act="save">${isNew?"Tambah Karyawan":"Simpan Detail"}</button>
    </div>
  `;
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  box.querySelectorAll('[data-money="1"]').forEach(inp=>{
    inp.addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; });
  });
  const tglMulaiInput=box.querySelector('[data-detail-field="tanggalMulaiKerja"]');
  if(tglMulaiInput) tglMulaiInput.addEventListener("change", ()=>{ box.querySelector("#dtMasaKerja").textContent=masaKerjaText(tglMulaiInput.value); });

  box.querySelector('[data-act="cancel"]').addEventListener("click", ()=>document.body.removeChild(overlay));
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) document.body.removeChild(overlay); });
  const cetakBtn=box.querySelector('[data-act="cetak"]');
  if(cetakBtn) cetakBtn.addEventListener("click", ()=>cetakDetailKaryawan(k));
  box.querySelector('[data-act="save"]').addEventListener("click", async ()=>{
    const namaEl=box.querySelector('[data-detail-field="nama"]');
    if(isNew && !namaEl.value.trim()){ showToast("Isi nama karyawan"); return; }
    const idInput = document.getElementById("dtIdKaryawan").value.trim();
    box.querySelectorAll("[data-detail-field]").forEach(el=>{
      const key=el.getAttribute("data-detail-field");
      k[key] = el.getAttribute("data-money")==="1" ? parseMoneyInput(el.value) : el.value.trim();
    });
    box.querySelectorAll("[data-detail-field-bool]").forEach(el=>{
      const key=el.getAttribute("data-detail-field-bool");
      k[key] = el.value !== "tidak";
    });
    k.idKaryawan = idInput ? formatIdKaryawan(parseInt(idInput,10)||idInput) : k.idKaryawan;
    const idNum = parseInt(idInput,10);
    if(idNum && idNum >= NEXT_KARYAWAN_ID) NEXT_KARYAWAN_ID = idNum + 1; // majukan counter otomatis kalau nomor yang dipakai >= counter sekarang
    if(isNew){ k.status="aktif"; k.gajiAwal=k.gajiPokok; KARYAWAN.push(k); }
    const ok=await saveKaryawan();
    document.body.removeChild(overlay);
    showToast(ok ? (isNew?"Karyawan ditambahkan":"Detail tersimpan") : "Gagal tersimpan — coba lagi");
    if(onSaved) onSaved();
  });
}

function renderDaftar(c){

const CONTOH_TARIF_JABATAN=[
  { nama:"Kepala Operasional", kelipatan:5, alasan:"Awasi semua unit" },
  { nama:"Koordinator Unit", kelipatan:4, alasan:"Pimpin tim, unit besar/berkembang" },

  { nama:"Admin Keuangan", kelipatan:2, alasan:"Pegang data uang seluruh unit (lintas unit, bukan cuma 1)" },
  { nama:"Kasir", kelipatan:1, alasan:"Eksekusi transaksi" },
  { nama:"Staf Desain", kelipatan:1, alasan:"Keahlian spesifik" },
  { nama:"Staf Gudang/Stok", kelipatan:1, alasan:"Operasional dasar" },
];
function defaultKelipatanUntuk(nama){
  const d=CONTOH_TARIF_JABATAN.find(t=>normalizeJabatanName(t.nama)===normalizeJabatanName(nama));
  return d ? d.kelipatan : null;
}
function renderTarifJabatan(c){

        Nominal tunjangan tiap jabatan = <b>Nilai Basis × Kelipatan</b>. Kelipatan dan Nilai Basis bebas diubah kapan saja;
        pertahankan saja urutannya (kelipatan jabatan atas sebaiknya tidak lebih kecil dari yang di bawahnya).
        Nominal ini otomatis jadi usulan Tunjangan Jabatan di halaman Gaji Bulanan sesuai jabatan tiap karyawan (tetap bisa diedit manual per orang).

      <div class="field-inline" style="max-width:220px;margin-bottom:14px;">
        <label class="f-label">Nilai Basis (notasi ribuan)</label>
        <div class="input-money"><span>Rp</span><input type="text" inputmode="numeric" class="money" id="tfBasis" placeholder="0"></div>
      </div>
    </div>

    <div class="tbl-wrap" style="margin-bottom:14px;"><table>
      <thead><tr><th>Urutan</th><th>Jabatan</th><th>Kelipatan</th><th>Nominal</th><th></th></tr></thead>
      <tbody id="tfBody"></tbody>
    </table></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;">
      <button class="btn btn-ghost btn-sm" id="tfTambahBaris">+ Tambah Jabatan</button>
      <button class="btn btn-ghost btn-sm" id="tfContoh">Isi Contoh Bawaan</button>
      <button class="btn btn-primary" id="tfSimpan">Simpan Tarif Jabatan</button>
      <span id="tfStatus" style="font-size:12px;color:var(--muted);align-self:center;"></span>
    </div>

    <div class="card card-pad" style="max-width:640px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
        <div class="section-title" style="font-size:13px;margin:0;">Simulator Kelipatan (Maksimal 10 = 100%)</div>
        <button class="btn btn-ghost btn-sm" id="tfSimContoh">Isi Contoh Bawaan (7 Jabatan)</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">
        Atur langsung angka <b>Kelipatan</b> tiap jabatan — total gabungan maksimal <b>10</b> (setara 100%).
        Kalau satu dinaikkan (mis. 3 → 4), yang lain otomatis turun supaya total tetap di angka 10.
        <b>Kepala Operasional dikecualikan</b> (berdiri sendiri, kelipatannya diatur manual di tabel atas, tidak ikut simulasi ini).
        Kalau angkanya sudah pas, tekan "Terapkan" untuk memindahkannya ke tabel Kelipatan di atas.
      </div>
      <div id="tfSimList"></div>
      <div style="font-size:12.5px;font-weight:600;margin:10px 0;" id="tfSimTotal"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" id="tfSimTerapkan">Terapkan ke Kelipatan</button>
        <button class="btn btn-ghost btn-sm" id="tfSimResetDefault">↺ Kembalikan Semua ke Default</button>
      </div>
    </div>
  `;
  let localList = TARIF_JABATAN.length ? TARIF_JABATAN.map(t=>({...t})) : [];
  document.getElementById("tfBasis").value = NILAI_BASIS ? NILAI_BASIS.toLocaleString("id-ID") : "";
  document.getElementById("tfBasis").addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; renderList(); });

  function currentBasis(){ return parseMoneyInput(document.getElementById("tfBasis").value); }

  function renderList(){
    const basis=currentBasis();
    document.getElementById("tfBody").innerHTML = localList.length ? localList.map((t,i)=>{
      const def=defaultKelipatanUntuk(t.nama);
      const isDefault = def!==null && Math.abs(def-t.kelipatan)<0.001;
      return `
      <tr data-idx="${i}">
        <td>
          <button class="btn btn-ghost btn-sm" data-move="up" data-idx="${i}" ${i===0?"disabled":""} title="Naikkan">↑</button>
          <button class="btn btn-ghost btn-sm" data-move="down" data-idx="${i}" ${i===localList.length-1?"disabled":""} title="Turunkan">↓</button>
        </td>
        <td style="text-align:left;"><input type="text" data-tf-nama="${i}" value="${escapeHtml(t.nama)}" style="width:100%;"></td>
        <td>
          <input type="number" step="0.1" min="0" data-tf-kelipatan="${i}" value="${t.kelipatan}" style="width:80px;text-align:right;">
          ${def!==null ? `<div style="font-size:10px;color:var(--muted);margin-top:2px;">${isDefault?'(nilai default)':`default: ${def} <a href="javascript:void(0)" data-reset-default="${i}" style="color:var(--moss-dark);font-weight:600;">↺ kembalikan</a>`}</div>` : ''}
        </td>
        <td>${formatRupiah(Math.round(basis*t.kelipatan))}</td>
        <td><button class="btn btn-danger btn-sm" data-hapus="${i}">Hapus</button></td>
      </tr>`;
    }).join("") : `<tr><td colspan="5" class="empty-state">Belum ada jabatan. Klik "Isi Contoh Bawaan" atau "+ Tambah Jabatan".</td></tr>`;

    document.querySelectorAll("[data-tf-nama]").forEach(inp=>{
      inp.addEventListener("input", e=>{ localList[+e.target.getAttribute("data-tf-nama")].nama=e.target.value; });
      inp.addEventListener("change", renderList);
    });
    document.querySelectorAll("[data-reset-default]").forEach(a=>{
      a.addEventListener("click", ()=>{
        const idx=+a.getAttribute("data-reset-default");
        const def=defaultKelipatanUntuk(localList[idx].nama);
        if(def!==null){ localList[idx].kelipatan=def; renderList(); }
      });
    });
    document.querySelectorAll("[data-tf-kelipatan]").forEach(inp=>{
      inp.addEventListener("input", e=>{
        localList[+e.target.getAttribute("data-tf-kelipatan")].kelipatan=parseFloat(e.target.value)||0;
        renderList();
      });
    });
    document.querySelectorAll('[data-move="up"]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i=+btn.getAttribute("data-idx");
        [localList[i-1], localList[i]] = [localList[i], localList[i-1]];
        renderList();
      });
    });
    document.querySelectorAll('[data-move="down"]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i=+btn.getAttribute("data-idx");
        [localList[i+1], localList[i]] = [localList[i], localList[i+1]];
        renderList();
      });
    });
    document.querySelectorAll("[data-hapus]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        localList.splice(+btn.getAttribute("data-hapus"),1);
        renderList();
        initSimState(); renderSimulator();
      });
    });
  }
  document.getElementById("tfTambahBaris").addEventListener("click", ()=>{
    localList.push({ nama:"", kelipatan:1 });
    renderList();
    initSimState(); renderSimulator();
  });
  document.getElementById("tfContoh").addEventListener("click", async ()=>{
    if(localList.length && !(await customConfirm("Timpa daftar yang ada dengan contoh bawaan (6 jabatan)?","Ya, Timpa"))) return;
    localList = CONTOH_TARIF_JABATAN.map(t=>({...t}));
    if(!currentBasis()){ document.getElementById("tfBasis").value=(100).toLocaleString("id-ID"); }
    renderList();
    initSimState(); renderSimulator();
  });
  document.getElementById("tfSimpan").addEventListener("click", async ()=>{
    const clean=localList.filter(t=>t.nama.trim());
    TARIF_JABATAN=clean;
    NILAI_BASIS=currentBasis();
    const ok=await saveTarifJabatan();
    document.getElementById("tfStatus").textContent = ok ? `Tersimpan · ${new Date().toLocaleTimeString("id-ID")}` : "Gagal tersimpan — coba lagi";
    showToast(ok?"Tarif jabatan tersimpan":"Gagal menyimpan");
  });

  /* ---- Simulator Kelipatan (maksimal 10 = 100%), Kepala Operasional dikecualikan ---- */
  const SIM_MAX_KELIPATAN = 10;
  let simState=[];
  function buildGroup(){
    const independentIdx = localList.findIndex(t=>normalizeJabatanName(t.nama)==="kepala operasional");
    return localList.filter((t,i)=>i!==independentIdx);
  }
  function initSimState(){
    const group=buildGroup();
    const sumK=group.reduce((s,t)=>s+(Number(t.kelipatan)||0),0);
    simState = group.map(t=>({ item:t, kelipatan: sumK>0 ? (t.kelipatan/sumK*SIM_MAX_KELIPATAN) : (group.length?SIM_MAX_KELIPATAN/group.length:0) }));
  }
  function defaultSimKelipatanUntuk(nama){
    const groupDefaults = CONTOH_TARIF_JABATAN.filter(t=>normalizeJabatanName(t.nama)!=="kepala operasional");
    const sumDefaults = groupDefaults.reduce((s,t)=>s+t.kelipatan,0);
    const d = defaultKelipatanUntuk(nama);
    if(d===null || sumDefaults<=0) return null;
    return d/sumDefaults*SIM_MAX_KELIPATAN;
  }
  function renderSimulator(){
    document.getElementById("tfSimList").innerHTML = simState.length ? simState.map((s,i)=>{
      const pct=(s.kelipatan/SIM_MAX_KELIPATAN*100);
      const def=defaultSimKelipatanUntuk(s.item.nama);
      const isDefault = def!==null && Math.abs(def-s.kelipatan)<0.01;
      return `<div class="pct-sim-row">
        <div style="text-align:left;font-size:13px;">${escapeHtml(s.item.nama||"(tanpa nama)")}</div>
        <div>
          <input type="number" step="0.1" min="0" max="${SIM_MAX_KELIPATAN}" data-sim-pct="${i}" value="${s.kelipatan.toFixed(2)}" style="width:75px;text-align:right;">
          ${def!==null ? `<div style="font-size:9.5px;color:var(--muted);text-align:right;margin-top:2px;">${isDefault?'(default)':`def: ${def.toFixed(2)} <a href="javascript:void(0)" data-sim-reset="${i}" style="color:var(--moss-dark);font-weight:600;">↺</a>`}</div>` : ''}
        </div>
        <div style="font-size:11.5px;color:var(--muted);text-align:right;">≈ ${pct.toFixed(1)}%</div>
      </div>`;
    }).join("") : `<div class="empty-state">Belum ada jabatan selain Kepala Operasional untuk disimulasikan.</div>`;
    document.querySelectorAll("[data-sim-pct]").forEach(inp=>{
      inp.addEventListener("change", e=>{
        redistribute(+e.target.getAttribute("data-sim-pct"), parseFloat(e.target.value)||0);
      });
    });
    document.querySelectorAll("[data-sim-reset]").forEach(a=>{
      a.addEventListener("click", ()=>{
        const idx=+a.getAttribute("data-sim-reset");
        const def=defaultSimKelipatanUntuk(simState[idx].item.nama);
        if(def!==null) redistribute(idx, def);
      });
    });
    const total=simState.reduce((s,o)=>s+o.kelipatan,0);
    document.getElementById("tfSimTotal").textContent = `Total kelipatan: ${total.toFixed(2)} / ${SIM_MAX_KELIPATAN} (${(total/SIM_MAX_KELIPATAN*100).toFixed(1)}%)`;
  }
  function redistribute(changedIdx, newVal){
    newVal=Math.max(0,Math.min(SIM_MAX_KELIPATAN,newVal));
    const oldVal=simState[changedIdx].kelipatan;
    const delta=newVal-oldVal;
    simState[changedIdx].kelipatan=newVal;
    const others=simState.filter((_,i)=>i!==changedIdx);
    if(others.length){
      const sumOthers=others.reduce((s,o)=>s+o.kelipatan,0);
      if(sumOthers>0){ others.forEach(o=>{ o.kelipatan=Math.max(0, o.kelipatan-delta*(o.kelipatan/sumOthers)); }); }
      else{ others.forEach(o=>{ o.kelipatan=Math.max(0, -delta/others.length); }); }
    }
    const total=simState.reduce((s,o)=>s+o.kelipatan,0);
    if(total>0 && Math.abs(total-SIM_MAX_KELIPATAN)>0.001){ const f=SIM_MAX_KELIPATAN/total; simState.forEach(o=>{ o.kelipatan*=f; }); }
    renderSimulator();
  }
  document.getElementById("tfSimTerapkan").addEventListener("click", ()=>{
    simState.forEach(s=>{ s.item.kelipatan=Math.round(s.kelipatan*100)/100; });
    renderList();
    showToast("Kelipatan diterapkan dari simulator ke tabel di atas — jangan lupa tekan Simpan Tarif Jabatan");
  });
  document.getElementById("tfSimContoh").addEventListener("click", async ()=>{
    if(localList.length && !(await customConfirm("Timpa daftar yang ada dengan contoh bawaan (7 jabatan)?","Ya, Timpa"))) return;
    localList = CONTOH_TARIF_JABATAN.map(t=>({nama:t.nama, kelipatan:t.kelipatan}));
    if(!currentBasis()){ document.getElementById("tfBasis").value=(100).toLocaleString("id-ID"); }
    renderList();
    initSimState(); renderSimulator();
  });
  document.getElementById("tfSimResetDefault").addEventListener("click", ()=>{
    simState.forEach(s=>{
      const def=defaultSimKelipatanUntuk(s.item.nama);
      if(def!==null) s.kelipatan=def;
    });
    renderSimulator();
    showToast("Semua dikembalikan ke porsi default (belum diterapkan ke tabel — tekan Terapkan kalau sudah yakin)");
  });
  initSimState();
  renderSimulator();

  renderList();
}

function renderStrukGaji(c){
  const now=new Date();
  const monthOptions=MONTH_NAMES.map((mn,i)=>`<option value="${i+1}">${mn}</option>`).join("");
  const years=[...new Set([now.getFullYear(), now.getFullYear()-1])].sort((a,b)=>b-a);
  const yearOptions=years.map(y=>`<option value="${y}">${y}</option>`).join("");
  const unitOptions=`<option value="">Semua Unit</option>`+UNITS.map(u=>`<option value="${u.key}">${escapeHtml(u.label)}</option>`).join("");
  c.innerHTML=`
    <div class="no-print" style="font-size:11.5px;color:var(--muted);margin-bottom:12px;">Halaman ini menampilkan <b>nilai riil</b> (angka yang tersimpan × 1000) — satu-satunya tempat di aplikasi yang menampilkan angka riil, bukan notasi ribuan.</div>
    <div class="controlbar no-print">
      <div class="field-inline"><label class="f-label">Tahun</label><select id="skTahun">${yearOptions}</select></div>
      <div class="field-inline"><label class="f-label">Bulan</label><select id="skBulan">${monthOptions}</select></div>
      <div class="field-inline"><label class="f-label">Unit</label><select id="skUnit">${unitOptions}</select></div>
      <button class="btn btn-primary" id="skPrint" style="align-self:end;">🖨️ Print / Simpan sebagai PDF</button>
    </div>
    <div id="skWrap"></div>
  `;
  document.getElementById("skBulan").value=String(now.getMonth()+1);

  function render(){
    const year=document.getElementById("skTahun").value;
    const m=String(document.getElementById("skBulan").value).padStart(2,"0");
    const ym=`${year}-${m}`;
    const unitKey=document.getElementById("skUnit").value;
    const bulanLabel=`${MONTH_NAMES[parseInt(m,10)-1]} ${year}`;

    let daftar=KARYAWAN.filter(k=>k.status==="aktif");
    if(unitKey) daftar=daftar.filter(k=>k.unitKey===unitKey);
    daftar=daftar.sort((a,b)=>a.nama.localeCompare(b.nama));

    if(!daftar.length){
      document.getElementById("skWrap").innerHTML=`<div class="empty-state">Belum ada karyawan aktif untuk kriteria ini.</div>`;
      return;
    }

    const cards = daftar.map((k,idx)=>{
      const gajiRec = GAJI.find(g=>g.karyawanId===k.id && g.bulan===ym);
      const bonusRecRaw = BONUS.filter(b=>b.karyawanId===k.id && b.bulan===ym).reduce((s,b)=>s+b.jumlah,0);
      const gajiAmount = (gajiRec ? gajiRec.jumlah : 0) * FAKTOR_RIBUAN;
      const tunjangan = (gajiRec ? (gajiRec.tunjanganJabatan||0) : 0) * FAKTOR_RIBUAN;
      const bonusRec = bonusRecRaw * FAKTOR_RIBUAN;
      const total = gajiAmount + tunjangan + bonusRec;
      return `
        <div class="struk-card">
          <div class="struk-head">
            <span class="struk-no">${escapeHtml(k.idKaryawan||"-")}</span>
            <span class="struk-nama">${escapeHtml(k.nama.toUpperCase())}</span>

          ${tunjangan>0?`<div class="struk-row"><span class="lbl">Tunjangan Jabatan${k.jabatan?' ('+escapeHtml(k.jabatan)+')':''}</span><span class="val">${formatRupiah(tunjangan)}</span></div>`:''}

/* ================= PLAFON GAJI ================= */
function renderPlafonGaji(c){
  const now=new Date();
  const years=[...new Set(PEMASUKAN_RAW.map(r=>{ const dt=normalizeDateCell(r["Tanggal"]); return dt?dt.slice(0,4):null; }).filter(Boolean))];
  if(!years.includes(String(now.getFullYear()))) years.push(String(now.getFullYear()));
  const yearOptions=[...new Set(years)].sort((a,b)=>b.localeCompare(a)).map(y=>`<option value="${y}">${y}</option>`).join("");

  c.innerHTML=`
    <div class="card card-pad" style="max-width:640px;margin-bottom:18px;">
      <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">
        Plafon Gaji dihitung dari <b>rata-rata Kantong Operasional pada 3 bulan omzet paling rendah</b> dalam setahun,
        dikali <b>${(PORSI_GAJI_DARI_OPERASIONAL*100).toFixed(0)}%</b> (porsi Gaji dari Kantong Operasional).
        Angka ini jadi acuan: kalau Total Gaji Pokok semua karyawan aktif masih di bawah plafon, ada ruang untuk tambah karyawan atau naikkan gaji.
        Kalau sudah melebihi, sebaiknya ditahan dulu sampai omzet membaik.
      </div>
    </div>
    <div class="controlbar">
      <div class="field-inline"><label class="f-label">Tahun</label><select id="pfTahun">${yearOptions}</select></div>
    </div>
    <div id="pfHasil"></div>

    <div class="section-title" style="margin-top:26px;">Riwayat Laporan Akhir Tahun</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Tahun</th><th>Plafon</th><th>Total Gaji Pokok Saat Dicatat</th><th>Bulan Terendah yang Dipakai</th><th>Tanggal Dicatat</th></tr></thead>
      <tbody id="pfHistBody"></tbody>
    </table></div>
  `;
  document.getElementById("pfTahun").value=String(now.getFullYear());
  document.getElementById("pfTahun").addEventListener("change", render);

  function totalGajiPokokAktif(){
    return KARYAWAN.filter(k=>k.status==="aktif").reduce((s,k)=>s+(k.gajiPokok||0),0);
  }

  function render(){
    const year=parseInt(document.getElementById("pfTahun").value,10);
    const hasil=hitungPlafonGaji(year);
    const totalGaji=totalGajiPokokAktif();
    if(!hasil){
      document.getElementById("pfHasil").innerHTML=`<div class="empty-state">Belum ada data Kas Masuk untuk tahun ${year}.</div>`;
      return;
    }
    const sisa=hasil.plafon-totalGaji;
    const over=sisa<0;
    document.getElementById("pfHasil").innerHTML=`
      <div class="grid3" style="margin-bottom:16px;">
        <div class="stat-card c-gold"><div class="label">Rata Operasional (3 Bulan Terendah)</div><div class="value">${formatRupiah(hasil.rataOperasional)}</div><div class="sub">notasi ribuan</div></div>
        <div class="stat-card c-blue"><div class="label">Plafon Gaji (${(PORSI_GAJI_DARI_OPERASIONAL*100).toFixed(0)}%)</div><div class="value">${formatRupiah(hasil.plafon)}</div><div class="sub">notasi ribuan</div></div>
        <div class="stat-card ${over?'':'c-plum'}" style="${over?'border-left-color:var(--danger);':''}"><div class="label">Total Gaji Pokok Aktif Saat Ini</div><div class="value" style="${over?'color:var(--danger);':''}">${formatRupiah(totalGaji)}</div><div class="sub">${over?`Melebihi plafon ${formatRupiah(Math.abs(sisa))}`:`Sisa ruang ${formatRupiah(sisa)}`}</div></div>
      </div>
      <div class="card card-pad" style="margin-bottom:16px;">
        <div class="section-title" style="font-size:13px;">3 Bulan Omzet Terendah Tahun ${year}</div>
        <table style="width:100%;font-size:13px;"><tbody>
          ${hasil.bulanTerendah.map(b=>`<tr><td style="text-align:left;padding:4px 0;">${b.nama}</td><td style="text-align:right;padding:4px 0;">Omzet ${formatRupiah(b.omzet)}</td><td style="text-align:right;padding:4px 0;color:var(--muted);">Operasional ${formatRupiah(b.operasional)}</td></tr>`).join("")}
        </tbody></table>
      </div>
      <button class="btn btn-primary" id="pfSimpanLaporan">Simpan sebagai Laporan Akhir Tahun ${year}</button>
      <span id="pfStatus" style="font-size:12px;color:var(--muted);margin-left:10px;"></span>
    `;
    document.getElementById("pfSimpanLaporan").addEventListener("click", async ()=>{
      const existing=PLAFON_GAJI.find(p=>p.tahun===String(year));
      if(existing && !(await customConfirm(`Sudah ada laporan Plafon Gaji untuk tahun ${year}. Timpa dengan hasil terbaru?`,"Ya, Timpa"))) return;
      const record={ tahun:String(year), plafon:hasil.plafon, totalGajiSaatItu:totalGaji, tanggalDicatat:todayStr(), detail:hasil };
      if(existing){ Object.assign(existing, record); } else { PLAFON_GAJI.push(record); }
      const ok=await savePlafonGaji();
      document.getElementById("pfStatus").textContent = ok?`Tersimpan · ${new Date().toLocaleTimeString("id-ID")}`:"Gagal tersimpan — coba lagi";
      showToast(ok?"Laporan Plafon Gaji tersimpan":"Gagal menyimpan");
      renderHist();
    });
  }
  function renderHist(){
    const rows=[...PLAFON_GAJI].sort((a,b)=>b.tahun.localeCompare(a.tahun));
    document.getElementById("pfHistBody").innerHTML = rows.length ? rows.map(p=>`
      <tr>
        <td class="rowdate">${p.tahun}</td>
        <td>${formatRupiah(p.plafon)}</td>
        <td>${formatRupiah(p.totalGajiSaatItu)}</td>
        <td style="text-align:left;font-size:12px;color:var(--muted);">${escapeHtml(p.bulanTerendahStr||"-")}</td>
        <td>${p.tanggalDicatat}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="empty-state">Belum ada laporan tersimpan.</td></tr>`;
  }
  render(); renderHist();
}

/* ================= RIWAYAT GAJI (Gaji Awal vs Saat Ini, pola kenaikan) ================= */
function renderRiwayatGaji(c){
  c.innerHTML=`
    <div class="card card-pad" style="margin-bottom:16px;">
      <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">
        <b>Pola kenaikan gaji tahunan (otomatis):</b> tiap ulang tahun masa kerja, gaji naik mengikuti pola berulang
        <b>100, 100, 200</b> (tahun ke-1 &amp; ke-2 naik 100, tahun ke-3 naik 200, lalu berulang untuk tahun ke-4,5,6 dst).
        Kolom <b>"Gaji Sesuai Pola"</b> adalah usulan otomatis berdasarkan Gaji Awal dan masa kerja saat ini — bisa langsung diterapkan lewat tombol "Terapkan Pola".
        <b>Gaji Saat Ini tetap bisa diedit manual kapan saja</b> untuk kenaikan di luar pola (mis. promosi khusus) — kalau tidak diubah manual, defaultnya mengikuti pola ini.
      </div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Nama</th><th>Gaji Awal</th><th>Tgl Mulai Kerja</th><th>Masa Kerja</th><th>Gaji Sesuai Pola</th><th>Gaji Saat Ini</th><th></th></tr></thead>
      <tbody id="rgBody"></tbody>
    </table></div>
  `;
  function renderList(){
    const rows=[...KARYAWAN].filter(k=>k.status==="aktif").sort((a,b)=>a.nama.localeCompare(b.nama));
    document.getElementById("rgBody").innerHTML = rows.length ? rows.map(k=>{
      const pola=gajiPokokSesuaiPola(k);
      const matchPola = Math.abs(pola-(k.gajiPokok||0))<0.01;
      return `<tr data-id="${k.id}">
        <td style="text-align:left;">${escapeHtml(k.nama)}</td>
        <td>
          <div class="input-money" style="max-width:120px;margin-left:auto;"><span>Rp</span><input type="text" inputmode="numeric" class="money" data-gajiawal-input="${k.id}" value="${(k.gajiAwal||k.gajiPokok||0).toLocaleString('id-ID')}"></div>
        </td>
        <td style="font-size:12px;color:var(--muted);">${k.tanggalMulaiKerja||"-"}</td>
        <td style="font-size:12px;">${escapeHtml(masaKerjaText(k.tanggalMulaiKerja))}</td>
        <td style="color:var(--muted);">${formatRupiah(pola)}${matchPola?' <span style="color:var(--moss-dark);font-size:10.5px;">(sesuai)</span>':''}</td>
        <td>
          <div class="input-money" style="max-width:130px;margin-left:auto;"><span>Rp</span><input type="text" inputmode="numeric" class="money" data-gajisaatini-input="${k.id}" value="${(k.gajiPokok||0).toLocaleString('id-ID')}"></div>
          ${!matchPola?`<div style="font-size:10px;text-align:right;margin-top:2px;"><a href="javascript:void(0)" data-terapkan-pola="${k.id}" style="color:var(--moss-dark);font-weight:600;">↺ Terapkan Pola</a></div>`:''}
        </td>
        <td></td>
      </tr>`;
    }).join("") : `<tr><td colspan="7" class="empty-state">Belum ada karyawan aktif.</td></tr>`;

    document.querySelectorAll("[data-gajiawal-input]").forEach(inp=>{
      inp.addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; });
      inp.addEventListener("change", async e=>{
        const id=e.target.getAttribute("data-gajiawal-input");
        const k=KARYAWAN.find(x=>x.id===id); if(!k) return;
        k.gajiAwal=parseMoneyInput(e.target.value);
        const ok=await saveKaryawan(); showToast(ok?"Gaji Awal tersimpan":"Gagal tersimpan"); renderList();
      });
    });
    document.querySelectorAll("[data-gajisaatini-input]").forEach(inp=>{
      inp.addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; });
      inp.addEventListener("change", async e=>{
        const id=e.target.getAttribute("data-gajisaatini-input");
        const k=KARYAWAN.find(x=>x.id===id); if(!k) return;
        k.gajiPokok=parseMoneyInput(e.target.value);
        const ok=await saveKaryawan(); showToast(ok?"Gaji Saat Ini tersimpan (manual)":"Gagal tersimpan"); renderList();
      });
    });
    document.querySelectorAll("[data-terapkan-pola]").forEach(a=>{
      a.addEventListener("click", async ()=>{
        const id=a.getAttribute("data-terapkan-pola");
        const k=KARYAWAN.find(x=>x.id===id); if(!k) return;
        k.gajiPokok=gajiPokokSesuaiPola(k);
        const ok=await saveKaryawan(); showToast(ok?"Gaji diterapkan sesuai pola":"Gagal tersimpan"); renderList();
      });
    });
  }
  renderList();
}

function renderGaji(c){

      <thead><tr><th>Nama</th><th>Jabatan</th><th>Gaji Pokok</th><th>Tunjangan Jabatan</th><th>Bonus</th><th>Total</th><th>Keterangan</th></tr></thead>

    <button class="btn btn-primary" id="gjSimpan">Simpan Pembayaran Gaji Bulan Ini</button>
    <span id="gjStatus" style="font-size:12px;color:var(--muted);margin-left:10px;"></span>

    <div class="section-title" style="margin-top:26px;">Riwayat Pembayaran Gaji</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Karyawan</th><th>Bulan</th><th>Jumlah</th><th>Tunjangan Jabatan</th><th>Keterangan</th><th></th></tr></thead>
      <tbody id="gjHistBody"></tbody>
    </table></div>
  `;

  document.getElementById("gjLinkTarif").addEventListener("click", ()=>navigateTo("tarif"));

  function ym(){ return `${document.getElementById("gjTahun").value}-${String(document.getElementById("gjBulan").value).padStart(2,"0")}`; }
  function bonusForKaryawanMonth(karyawanId, currentYm){
    return BONUS.filter(b=>b.karyawanId===karyawanId && b.bulan===currentYm).reduce((s,b)=>s+b.jumlah,0);
  }
  function renderForm(){
    const currentYm=ym();
    const aktif=KARYAWAN.filter(k=>k.status==="aktif").sort((a,b)=>a.nama.localeCompare(b.nama));
    let totalGaji=0, totalTunjangan=0, totalBonus=0, totalSemua=0;
    document.getElementById("gjBody").innerHTML = aktif.length ? aktif.map(k=>{
      const existing=GAJI.find(g=>g.karyawanId===k.id && g.bulan===currentYm);
      const jumlah = k.gajiPokok; // selalu ikut Daftar Karyawan
      const tunjangan = tarifUntukJabatan(k.jabatan); // selalu ikut Tarif Jabatan
      const bonus = bonusForKaryawanMonth(k.id, currentYm);
      const rowTotal = jumlah + tunjangan + bonus;
      totalGaji+=jumlah; totalTunjangan+=tunjangan; totalBonus+=bonus; totalSemua+=rowTotal;
      return `<tr data-karyawan="${k.id}">
        <td style="text-align:left;">${escapeHtml(k.nama)}</td>
        <td style="text-align:left;">${escapeHtml(k.jabatan||"-")}</td>
        <td>${formatRupiah(jumlah)}</td>
        <td>${tunjangan?formatRupiah(tunjangan):"-"}</td>
        <td style="color:var(--muted);">${bonus?formatRupiah(bonus):"-"}</td>
        <td style="font-weight:700;">${formatRupiah(rowTotal)}</td>
        <td><input type="text" data-ket-input="${k.id}" value="${escapeHtml((existing&&existing.keterangan)||'')}" placeholder="opsional" style="width:100%;"></td>
      </tr>`;
    }).join("") : `<tr><td colspan="7" class="empty-state">Belum ada karyawan aktif.</td></tr>`;
    document.getElementById("gjFoot").innerHTML=`<td colspan="2">Total</td><td>${formatRupiah(totalGaji)}</td><td>${formatRupiah(totalTunjangan)}</td><td>${formatRupiah(totalBonus)}</td><td>${formatRupiah(totalSemua)}</td><td></td>`;
  }
  function renderHist(){
    const rows=[...GAJI].sort((a,b)=>b.tanggalBayar.localeCompare(a.tanggalBayar));

        <td>${escapeHtml(karyawanLabel(g.karyawanId))}</td>
        <td>${g.bulan}</td>
        <td>${formatRupiah(g.jumlah)}</td>
        <td>${g.tunjanganJabatan?formatRupiah(g.tunjanganJabatan):"-"}</td>
        <td style="text-align:left;">${escapeHtml(g.keterangan||"-")}</td>
        <td><button class="btn btn-danger btn-sm" data-delgaji="${g.id}">Hapus</button></td>
      </tr>`).join("") : `<tr><td colspan="7" class="empty-state">Belum ada riwayat.</td></tr>`;
    document.querySelectorAll("[data-delgaji]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(await customConfirm("Hapus catatan gaji ini?","Ya, Hapus")){
          GAJI=GAJI.filter(x=>x.id!==btn.getAttribute("data-delgaji"));
          await saveGaji(); renderHist(); showToast("Dihapus");
        }
      });
    });
  }
  document.getElementById("gjTahun").addEventListener("change", renderForm);
  document.getElementById("gjBulan").addEventListener("change", renderForm);
  document.getElementById("gjSimpan").addEventListener("click", async ()=>{
    const currentYm=ym();
    const aktif=KARYAWAN.filter(k=>k.status==="aktif");
    aktif.forEach(k=>{
      const jumlah=k.gajiPokok;
      const tunjanganJabatan=tarifUntukJabatan(k.jabatan);
      const ketInput=document.querySelector(`[data-ket-input="${k.id}"]`);
      const keterangan=ketInput?ketInput.value.trim():"";
      if(!jumlah && !tunjanganJabatan && !keterangan) return;
      const existing=GAJI.find(g=>g.karyawanId===k.id && g.bulan===currentYm);
      if(existing){ existing.jumlah=jumlah; existing.tunjanganJabatan=tunjanganJabatan; existing.keterangan=keterangan; }
      else{ GAJI.push({ id:uid(), karyawanId:k.id, bulan:currentYm, jumlah, tunjanganJabatan, tanggalBayar:todayStr(), keterangan }); }
    });
    const ok=await saveGaji();
    document.getElementById("gjStatus").textContent = ok ? `Tersimpan · ${new Date().toLocaleTimeString("id-ID")}` : "Gagal tersimpan — coba lagi";
    renderHist();
    showToast(ok ? "Gaji tersimpan" : "Gagal menyimpan");
  });
  renderForm(); renderHist();
}
