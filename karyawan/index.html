<style>
:root{
  --navy:#152420; --navy-2:#1d322c; --navy-3:#254038;
  --paper:#f5f3ec; --paper-2:#ffffff;
  --ink:#1f2a24; --muted:#7c7768; --line:#e2ddce;

}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;}
a{color:inherit;}

.sidebar{

.sidebar .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}

.navgroup{padding:14px 12px 4px;}

}
.navlink:hover{background:rgba(255,255,255,.06);color:#fff;}
.navlink.active{background:var(--moss);color:#fff;}

.main{flex:1;margin-left:236px;min-width:0;}
.topheader{

.input-money{position:relative;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--moss-dark);color:#f2efe4;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;}

.modal-box.elegant .modal-header-elegant .eyebrow-x{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:3px;}

.section-title-elegant .tag{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;background:#f1eee2;padding:2px 8px;border-radius:999px;margin-left:auto;}
.modal-box.elegant .field-inline label.f-label{color:#5a5646;}

  .page-content{padding:18px 16px 60px;}
  .topheader{padding:14px 16px;}
}

<script>
/* ================= KONFIGURASI (sama dengan aplikasi Keuangan, satu Spreadsheet) ================= */
const OAUTH_CLIENT_ID = "161910278592-4g8h4oi240lg88hkjlm0ja8nl7jnq53v.apps.googleusercontent.com";
const SPREADSHEET_ID = "1bAS8NIzcSSENH5o9MSucaINMURUcwXFCRln0w4_g23A";
const OAUTH_SCOPE = "https://www.googleapis.com/auth/spreadsheets";

const SHEET_UNIT="Unit", SHEET_KAS_MASUK="Kas Masuk", SHEET_TARGET_OMZET="Target Omzet";
const SHEET_KARYAWAN="Karyawan", SHEET_GAJI="Gaji", SHEET_BONUS="Bonus";
const HDR_KARYAWAN=["Nama","Unit","Jabatan","Gaji Pokok","Status","No HP",
  "NIK","Tempat Lahir","Tanggal Lahir","Jenis Kelamin","Alamat","Akun Medsos",
  "Tanggal Mulai Kerja","Jenis Karyawan","Level Kompetensi",
  "Nama Orang Tua","Jumlah Saudara","Kontak Darurat Nama","Kontak Darurat HP","Kontak Darurat Hubungan",
  "Pendidikan Terakhir","Tahun Lulus","Pengalaman Kerja","Masa Kerja Sebelumnya","Catatan"];
const HDR_GAJI=["Tanggal Bayar","Karyawan","Bulan","Jumlah","Keterangan"];
const HDR_BONUS=["Tanggal Bayar","Karyawan","Unit","Bulan","Jumlah"];
const MONTH_NAMES=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function asText(v){ return "'"+v; }

/* ================= AUTH GOOGLE (sama seperti Keuangan) ================= */
let googleAccessToken=null, googleTokenClient=null, signedInEmail=null, isSignedIn=false, triedSilentLogin=false;
function waitForGoogleGis(timeoutMs){
  return new Promise((resolve)=>{
    const started=Date.now();
    (function check(){
      if(window.google && google.accounts && google.accounts.oauth2){ resolve(true); return; }
      if(Date.now()-started>(timeoutMs||8000)){ resolve(false); return; }
      setTimeout(check,100);
    })();
  });
}
async function initGoogleAuth(){
  const ready=await waitForGoogleGis(8000);
  if(!ready){ console.error("Script Google Identity Services tidak kunjung siap."); return false; }
  try{
    googleTokenClient=google.accounts.oauth2.initTokenClient({ client_id:OAUTH_CLIENT_ID, scope:OAUTH_SCOPE, callback:()=>{} });
    return true;
  }catch(e){ console.error("Gagal init Google Auth:",e); return false; }
}
function requestGoogleSignIn(prompt){
  return new Promise((resolve)=>{
    googleTokenClient.callback=(tokenResponse)=>{
      if(tokenResponse && tokenResponse.access_token){
        googleAccessToken=tokenResponse.access_token; isSignedIn=true;
        fetchSignedInEmail().finally(()=>resolve(true));
      } else { resolve(false); }
    };
    googleTokenClient.error_callback=()=>resolve(false);
    googleTokenClient.requestAccessToken({ prompt: prompt||"" });
  });
}
async function fetchSignedInEmail(){
  try{
    const res=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{ headers:{ Authorization:`Bearer ${googleAccessToken}` } });
    if(!res.ok) return;
    const info=await res.json(); signedInEmail=info.email||null;
  }catch(e){}
}
function googleSignOut(){
  if(googleAccessToken && window.google && google.accounts && google.accounts.oauth2){ google.accounts.oauth2.revoke(googleAccessToken, ()=>{}); }
  googleAccessToken=null; signedInEmail=null; isSignedIn=false;
  location.reload();
}

/* ================= SHEETS API v4 (sama seperti Keuangan) ================= */
async function sheetsApiFetch(path, options){
  const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}${path}`,{
    ...options, headers:{ "Authorization":`Bearer ${googleAccessToken}`, "Content-Type":"application/json", ...(options&&options.headers) }
  });
  if(res.status===401){
    const ok=await requestGoogleSignIn("");
    if(ok){
      return fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}${path}`,{
        ...options, headers:{ "Authorization":`Bearer ${googleAccessToken}`, "Content-Type":"application/json", ...(options&&options.headers) }
      });
    }
  }
  return res;
}
let sheetTitlesCache=null;
async function ensureSheetExists(sheetName){
  try{
    if(!sheetTitlesCache){
      const res=await sheetsApiFetch(`?fields=sheets.properties.title`,{method:"GET"});
      if(res.ok){ const data=await res.json(); sheetTitlesCache=(data.sheets||[]).map(s=>s.properties.title); }
      else { sheetTitlesCache=[]; }
    }
    if(sheetTitlesCache.includes(sheetName)) return true;
    const addRes=await sheetsApiFetch(`:batchUpdate`,{ method:"POST", body:JSON.stringify({ requests:[{ addSheet:{ properties:{ title:sheetName } } }] }) });
    if(addRes.ok){ sheetTitlesCache.push(sheetName); return true; }
    if(addRes.status===400){ sheetTitlesCache=null; return true; }
    return false;
  }catch(e){ console.error("Gagal memastikan tab sheet ada:",sheetName,e); return false; }
}
function rowsToGrid(headers,rowObjects){
  return rowObjects.map(r=>headers.map(h=>{ let v=r[h]; if(v===undefined||v===null) v=""; if(typeof v==="string"&&v.startsWith("'")) v=v.slice(1); return v; }));
}
function gridToRows(values){
  if(!values||values.length<1) return [];
  const headers=values[0];
  return values.slice(1).map(row=>{ const o={}; headers.forEach((h,i)=>{ o[h]=row[i]!==undefined?row[i]:""; }); return o; });
}
async function sheetsGetAll(sheetName){
  const attempts=3;
  for(let i=0;i<attempts;i++){
    try{
      const res=await sheetsApiFetch(`/values/${encodeURIComponent(sheetName)}`,{method:"GET"});
      if(res.status===400){ return []; }
      if(!res.ok){ throw new Error(`HTTP ${res.status}`); }
      const data=await res.json();
      return gridToRows(data.values||[]);
    }catch(e){
      if(i===attempts-1){ console.error(`Gagal memuat sheet "${sheetName}":`,e); return null; }
      await new Promise(r=>setTimeout(r,500*(i+1)));
    }
  }
}
async function sheetsReplaceAll(sheetName,headers,rows){
  const attempts=3;
  const grid=[headers, ...rowsToGrid(headers,rows)];
  for(let i=0;i<attempts;i++){
    try{
      const exists=await ensureSheetExists(sheetName);
      if(!exists) throw new Error(`Gagal memastikan/membuat tab "${sheetName}"`);
      const clearRes=await sheetsApiFetch(`/values/${encodeURIComponent(sheetName)}:clear`,{method:"POST",body:"{}"});
      if(!clearRes.ok) throw new Error(`Gagal clear (HTTP ${clearRes.status})`);
      const updateRes=await sheetsApiFetch(`/values/${encodeURIComponent(sheetName)}?valueInputOption=USER_ENTERED`,{
        method:"PUT", body:JSON.stringify({ range:sheetName, majorDimension:"ROWS", values:grid })
      });
      if(!updateRes.ok) throw new Error(`Gagal update (HTTP ${updateRes.status})`);
      return true;
    }catch(e){
      if(i===attempts-1){ console.error(`Gagal menyimpan sheet "${sheetName}":`,e); return false; }
      await new Promise(r=>setTimeout(r,500*(i+1)));
    }
  }
}
function normalizeDateCell(v){
  if(v===null||v===undefined) return null;
  const s=String(v).trim();
  const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  return null;
}
function unitByLabelMap(unitsList){ const m={}; unitsList.forEach(u=>{ m[u.label.trim().toLowerCase()]=u.key; }); return m; }

/* ================= STATE ================= */
let UNITS=[];               // [{key,label}] — dibaca dari Sheet "Unit" (dikelola aplikasi Keuangan)
let PEMASUKAN_RAW=[];        // baris mentah "Kas Masuk" (dipakai hitung realisasi omzet utk bonus)
let TARGET_OMZET={};         // { unitKey: { "YYYY-MM": target } }
let KARYAWAN=[];             // [{id,nama,unitKey,jabatan,gajiPokok,status,noHp}]
let GAJI=[];                 // [{id,karyawanId,bulan,jumlah,tanggalBayar,keterangan}]
let BONUS=[];                // [{id,karyawanId,unitKey,bulan,jumlah,tanggalBayar}]

/* ================= UTILS ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }
function formatRupiah(n){ n=Number(n)||0; return "Rp "+n.toLocaleString("id-ID"); }
function parseMoneyInput(str){ if(!str) return 0; const c=String(str).replace(/[^\d]/g,""); return c?parseInt(c,10):0; }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function unitLabel(key){ const u=UNITS.find(x=>x.key===key); return u?u.label:(key||"-"); }
function karyawanLabel(id){ const k=KARYAWAN.find(x=>x.id===id); return k?k.nama:id; }
function masaKerjaText(tanggalMulai){
  if(!tanggalMulai) return "-";
  const mulai=new Date(tanggalMulai+"T00:00:00"); const now=new Date();
  if(isNaN(mulai.getTime()) || mulai>now) return "-";
  let bulan=(now.getFullYear()-mulai.getFullYear())*12 + (now.getMonth()-mulai.getMonth());
  if(now.getDate()<mulai.getDate()) bulan--;
  if(bulan<0) bulan=0;
  const th=Math.floor(bulan/12), bl=bulan%12;
  if(th<=0 && bl<=0) return "Baru mulai";
  const parts=[]; if(th>0) parts.push(`${th} tahun`); if(bl>0) parts.push(`${bl} bulan`);
  return parts.join(" ");
}
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1900); }
function monthRange(year,month){ const from=`${year}-${String(month).padStart(2,"0")}-01`; const lastDay=new Date(year,month,0).getDate(); const to=`${year}-${String(month).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`; return {from,to}; }

function customConfirm(message, okLabel){
  return new Promise(resolve=>{
    const overlay=document.createElement("div"); overlay.className="modal-overlay";
    overlay.innerHTML=`<div class="modal-box"><div class="modal-msg">${escapeHtml(message)}</div>
      <div class="modal-actions"><button class="btn btn-ghost" data-act="cancel">Batal</button><button class="btn btn-primary" data-act="ok">${escapeHtml(okLabel||"Ya, Lanjutkan")}</button></div></div>`;
    document.body.appendChild(overlay);
    const finish=(val)=>{ if(overlay.parentNode) document.body.removeChild(overlay); resolve(val); };
    overlay.querySelector('[data-act="ok"]').addEventListener("click",()=>finish(true));
    overlay.querySelector('[data-act="cancel"]').addEventListener("click",()=>finish(false));
    overlay.addEventListener("click",(e)=>{ if(e.target===overlay) finish(false); });
  });
}

/* ================= REALISASI OMZET & BONUS (logika sama dengan aplikasi Keuangan) ================= */
function realisasiOmzetForMonth(unitKey, year, m){
  const {from,to}=monthRange(year,m);
  let total=0;
  PEMASUKAN_RAW.forEach(r=>{
    const dt=normalizeDateCell(r["Tanggal"]); if(!dt||dt<from||dt>to) return;
    const rowUnitKey=(unitByLabelMap(UNITS))[String(r["Unit"]||"").trim().toLowerCase()];
    if(unitKey && rowUnitKey!==unitKey) return;
    const kas=(Number(r["Kas Pagi"])||0)+(Number(r["Kas Sore"])||0)+(Number(r["Transfer Pagi"])||0)+(Number(r["Transfer Sore"])||0);
    total+=kas;
  });
  return total;
}
function computeBonusPool(unitKey, year, m){
  const ym=`${year}-${String(m).padStart(2,"0")}`;
  const target=(TARGET_OMZET[unitKey]&&TARGET_OMZET[unitKey][ym])||0;
  const realisasi=realisasiOmzetForMonth(unitKey,year,m);
  if(!target||target<=0) return { target, realisasi, pct:null, bonusPct:0, bonusPool:0 };
  const pct=realisasi/target*100;
  let bonusPct=0;
  if(pct>=100) bonusPct=1; else if(pct>=90) bonusPct=0.5;
  const bonusPool=Math.round(realisasi*bonusPct/100);
  return { target, realisasi, pct, bonusPct, bonusPool };
}

function rowsFromTargetOmzet_placeholder(){ return []; } // tidak dipakai (Target Omzet dikelola dari aplikasi Keuangan)
function targetOmzetFromRows(rows, unitsList){
  const byLabel=unitByLabelMap(unitsList); const result={};
  rows.forEach(r=>{
    const labelRaw=String(r["Unit"]||"").trim();
    const key = labelRaw.toLowerCase()==="semua unit" ? "" : byLabel[labelRaw.toLowerCase()];
    if(key===undefined) return;
    const ym=String(r["Bulan"]||"").replace(/^'/,"").trim(); if(!ym) return;
    if(!result[key]) result[key]={};
    result[key][ym]=Number(r["Target"])||0;
  });
  return result;
}

async function handleSampulMasuk(){

  btn.disabled=true; btn.textContent="Menghubungkan...";

  const promptMode=triedSilentLogin?"consent":"";
  const ok=await requestGoogleSignIn(promptMode);

  if(!ok){

  navigateTo("dashboard");
}

    box.querySelectorAll("[data-detail-field]").forEach(el=>{
      const key=el.getAttribute("data-detail-field");
      k[key] = el.getAttribute("data-money")==="1" ? parseMoneyInput(el.value) : el.value.trim();
    });
    if(isNew){ k.status="aktif"; KARYAWAN.push(k); }
    const ok=await saveKaryawan();
    document.body.removeChild(overlay);
    showToast(ok ? (isNew?"Karyawan ditambahkan":"Detail tersimpan") : "Gagal tersimpan — coba lagi");
    if(onSaved) onSaved();
  });
}

        (Data Dasar, Data Pribadi, Kepegawaian, Pendidikan & Pengalaman, Keluarga & Kontak Darurat),

        Print dan berikan ke calon karyawan baru untuk diisi tangan sebelum datanya disalin ke aplikasi ini
        lewat menu <b>Daftar Karyawan → Karyawan Baru</b>.
      </div>
      <a href="./formulir-karyawan-baru.pdf" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none;display:inline-block;">
        Unduh / Buka Formulir (PDF)
      </a>
    </div>
  `;
}

function renderDaftar(c){
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="section-title" style="margin:0;">Daftar Karyawan</div>
      <button class="btn btn-primary" id="dkTambahBaru">+ Karyawan Baru</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Nama</th><th>Unit</th><th>Jabatan</th><th>Gaji Pokok</th><th>Status</th><th>No HP</th><th></th></tr></thead>
      <tbody id="dkBody"></tbody>
    </table></div>
  `;
  document.getElementById("dkTambahBaru").addEventListener("click", ()=>openDetailModal(null, renderList));

  function renderList(){
    const rows=[...KARYAWAN].sort((a,b)=>a.nama.localeCompare(b.nama));
    document.getElementById("dkBody").innerHTML = rows.length ? rows.map(k=>`
      <tr data-row="${k.id}">
        <td style="text-align:left;"><input type="text" data-edit="nama" data-id="${k.id}" value="${escapeHtml(k.nama)}" style="width:130px;"></td>
        <td><select data-edit="unitKey" data-id="${k.id}">${UNITS.map(u=>`<option value="${u.key}" ${u.key===k.unitKey?"selected":""}>${escapeHtml(u.label)}</option>`).join("")}</select></td>
        <td style="text-align:left;"><input type="text" data-edit="jabatan" data-id="${k.id}" value="${escapeHtml(k.jabatan||"")}" style="width:110px;"></td>
        <td><div class="input-money" style="max-width:140px;margin-left:auto;"><span>Rp</span><input type="text" inputmode="numeric" class="money" data-edit="gajiPokok" data-id="${k.id}" value="${k.gajiPokok?k.gajiPokok.toLocaleString('id-ID'):''}"></div></td>
        <td><span class="pill ${k.status}">${k.status==="aktif"?"Aktif":"Nonaktif"}</span></td>
        <td><input type="tel" data-edit="noHp" data-id="${k.id}" value="${escapeHtml(k.noHp||"")}" placeholder="08xx" style="width:110px;"></td>
        <td><button class="btn btn-ghost btn-sm" data-detail="${k.id}">Detail</button> <button class="btn btn-ghost btn-sm" data-toggle="${k.id}">${k.status==="aktif"?"Nonaktifkan":"Aktifkan"}</button> <button class="btn btn-danger btn-sm" data-del="${k.id}">Hapus</button></td>
      </tr>`).join("") : `<tr><td colspan="7" class="empty-state">Belum ada karyawan.</td></tr>`;

    document.querySelectorAll('[data-edit="gajiPokok"]').forEach(inp=>{
      inp.addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; });
    });
    document.querySelectorAll("[data-edit]").forEach(el=>{
      el.addEventListener("change", async ()=>{
        const id=el.getAttribute("data-id"); const field=el.getAttribute("data-edit");
        const k=KARYAWAN.find(x=>x.id===id); if(!k) return;
        k[field] = field==="gajiPokok" ? parseMoneyInput(el.value) : el.value.trim();
        const ok=await saveKaryawan();
        showToast(ok?"Tersimpan":"Gagal tersimpan — coba lagi");
      });
    });
    document.querySelectorAll("[data-detail]").forEach(btn=>{
      btn.addEventListener("click", ()=>openDetailModal(btn.getAttribute("data-detail"), renderList));
    });
    document.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const k=KARYAWAN.find(x=>x.id===btn.getAttribute("data-toggle"));
        k.status = k.status==="aktif" ? "nonaktif" : "aktif";
        await saveKaryawan(); renderList(); showToast("Status diperbarui");
      });
    });
    document.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(await customConfirm("Hapus data karyawan ini? Riwayat gaji/bonus yang sudah ada tidak ikut terhapus.","Ya, Hapus")){
          KARYAWAN=KARYAWAN.filter(x=>x.id!==btn.getAttribute("data-del"));
          await saveKaryawan(); renderList(); showToast("Karyawan dihapus");
        }
      });
    });
  }
  renderList();
}

/* ================= GAJI BULANAN ================= */
function renderGaji(c){
  const now=new Date();
  const monthOptions=MONTH_NAMES.map((mn,i)=>`<option value="${i+1}">${mn}</option>`).join("");
  const years=[...new Set([now.getFullYear(), now.getFullYear()-1, now.getFullYear()+1])].sort((a,b)=>b-a);
  const yearOptions=years.map(y=>`<option value="${y}">${y}</option>`).join("");
  c.innerHTML=`
    <div class="controlbar">
      <div class="field-inline"><label class="f-label">Tahun</label><select id="gjTahun">${yearOptions}</select></div>
      <div class="field-inline"><label class="f-label">Bulan</label><select id="gjBulan">${monthOptions}</select></div>
    </div>
    <div class="tbl-wrap" style="margin-bottom:22px;"><table>
      <thead><tr><th>Nama</th><th>Unit</th><th>Gaji Pokok</th><th>Jumlah Dibayar</th><th>Keterangan</th><th></th></tr></thead>
      <tbody id="gjBody"></tbody>
      <tfoot><tr id="gjFoot"></tr></tfoot>
    </table></div>
    <button class="btn btn-primary" id="gjSimpan">Simpan Pembayaran Gaji Bulan Ini</button>
    <span id="gjStatus" style="font-size:12px;color:var(--muted);margin-left:10px;"></span>

    <div class="section-title" style="margin-top:26px;">Riwayat Pembayaran Gaji</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Karyawan</th><th>Bulan</th><th>Jumlah</th><th>Keterangan</th><th></th></tr></thead>
      <tbody id="gjHistBody"></tbody>
    </table></div>
  `;
  document.getElementById("gjBulan").value=String(now.getMonth()+1);
  document.getElementById("gjTahun").value=String(now.getFullYear());

  function ym(){ return `${document.getElementById("gjTahun").value}-${String(document.getElementById("gjBulan").value).padStart(2,"0")}`; }
  function renderForm(){
    const currentYm=ym();
    const aktif=KARYAWAN.filter(k=>k.status==="aktif").sort((a,b)=>a.nama.localeCompare(b.nama));
    let total=0;
    document.getElementById("gjBody").innerHTML = aktif.length ? aktif.map(k=>{
      const existing=GAJI.find(g=>g.karyawanId===k.id && g.bulan===currentYm);
      const jumlah = existing ? existing.jumlah : k.gajiPokok;
      total+=jumlah;
      return `<tr data-karyawan="${k.id}">
        <td style="text-align:left;">${escapeHtml(k.nama)}</td>
        <td>${escapeHtml(unitLabel(k.unitKey))}</td>
        <td>${formatRupiah(k.gajiPokok)}</td>
        <td><div class="input-money" style="max-width:150px;margin-left:auto;"><span>Rp</span><input type="text" inputmode="numeric" class="money" data-gaji-input="${k.id}" value="${jumlah?jumlah.toLocaleString('id-ID'):''}"></div></td>
        <td><input type="text" data-ket-input="${k.id}" value="${escapeHtml((existing&&existing.keterangan)||'')}" placeholder="opsional" style="width:100%;"></td>
        <td></td>
      </tr>`;
    }).join("") : `<tr><td colspan="6" class="empty-state">Belum ada karyawan aktif.</td></tr>`;
    document.getElementById("gjFoot").innerHTML=`<td colspan="3">Total</td><td>${formatRupiah(total)}</td><td colspan="2"></td>`;
    document.querySelectorAll("[data-gaji-input]").forEach(inp=>{
      inp.addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; recalcTotal(); });
    });
  }
  function recalcTotal(){
    let total=0;
    document.querySelectorAll("[data-gaji-input]").forEach(inp=>{ total+=parseMoneyInput(inp.value); });
    document.querySelector("#gjFoot td:nth-child(2)").textContent=formatRupiah(total);
  }
  function renderHist(){
    const rows=[...GAJI].sort((a,b)=>b.tanggalBayar.localeCompare(a.tanggalBayar));
    document.getElementById("gjHistBody").innerHTML = rows.length ? rows.map(g=>`
      <tr>
        <td class="rowdate">${g.tanggalBayar}</td>
        <td>${escapeHtml(karyawanLabel(g.karyawanId))}</td>
        <td>${g.bulan}</td>
        <td>${formatRupiah(g.jumlah)}</td>
        <td style="text-align:left;">${escapeHtml(g.keterangan||"-")}</td>
        <td><button class="btn btn-danger btn-sm" data-delgaji="${g.id}">Hapus</button></td>
      </tr>`).join("") : `<tr><td colspan="6" class="empty-state">Belum ada riwayat.</td></tr>`;
    document.querySelectorAll("[data-delgaji]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(await customConfirm("Hapus catatan gaji ini?","Ya, Hapus")){
          GAJI=GAJI.filter(x=>x.id!==btn.getAttribute("data-delgaji"));
          await saveGaji(); renderHist(); showToast("Dihapus");
        }
      });
    });
  }
  document.getElementById("gjTahun").addEventListener("change", renderForm);
  document.getElementById("gjBulan").addEventListener("change", renderForm);
  document.getElementById("gjSimpan").addEventListener("click", async ()=>{
    const currentYm=ym();
    document.querySelectorAll("[data-gaji-input]").forEach(inp=>{
      const karyawanId=inp.getAttribute("data-gaji-input");
      const jumlah=parseMoneyInput(inp.value);
      const ketInput=document.querySelector(`[data-ket-input="${karyawanId}"]`);
      const keterangan=ketInput?ketInput.value.trim():"";
      if(!jumlah) return;
      const existing=GAJI.find(g=>g.karyawanId===karyawanId && g.bulan===currentYm);
      if(existing){ existing.jumlah=jumlah; existing.keterangan=keterangan; }
      else{ GAJI.push({ id:uid(), karyawanId, bulan:currentYm, jumlah, tanggalBayar:todayStr(), keterangan }); }
    });
    const ok=await saveGaji();
    document.getElementById("gjStatus").textContent = ok ? `Tersimpan · ${new Date().toLocaleTimeString("id-ID")}` : "Gagal tersimpan — coba lagi";
    renderHist();
    showToast(ok ? "Gaji tersimpan" : "Gagal menyimpan");
  });
  renderForm(); renderHist();
}

/* ================= BONUS ================= */
function renderBonus(c){
  const unitOptions=UNITS.map(u=>`<option value="${u.key}">${escapeHtml(u.label)}</option>`).join("");
  const now=new Date();
  const monthOptions=MONTH_NAMES.map((mn,i)=>`<option value="${i+1}">${mn}</option>`).join("");
  const years=[...new Set([now.getFullYear(), now.getFullYear()-1])].sort((a,b)=>b-a);
  const yearOptions=years.map(y=>`<option value="${y}">${y}</option>`).join("");
  c.innerHTML=`
    <div class="controlbar">
      <div class="field-inline"><label class="f-label">Unit</label><select id="bnUnit">${unitOptions}</select></div>
      <div class="field-inline"><label class="f-label">Tahun</label><select id="bnTahun">${yearOptions}</select></div>
      <div class="field-inline"><label class="f-label">Bulan</label><select id="bnBulan">${monthOptions}</select></div>
    </div>
    <div class="card card-pad" style="margin-bottom:18px;" id="bnPoolCard"></div>
    <div class="tbl-wrap" style="margin-bottom:16px;"><table>
      <thead><tr><th>Nama</th><th>Jabatan</th><th>Bagian Bonus</th></tr></thead>
      <tbody id="bnBody"></tbody>
      <tfoot><tr id="bnFoot"></tr></tfoot>
    </table></div>
    <button class="btn btn-ghost btn-sm" id="bnBagiRata">Bagi Rata ke Semua Karyawan Unit Ini</button>
    <button class="btn btn-primary" id="bnSimpan" style="margin-left:8px;">Simpan Pembayaran Bonus</button>
    <span id="bnStatus" style="font-size:12px;color:var(--muted);margin-left:10px;"></span>

    <div class="section-title" style="margin-top:26px;">Riwayat Pembayaran Bonus</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Karyawan</th><th>Unit</th><th>Bulan</th><th>Jumlah</th><th></th></tr></thead>
      <tbody id="bnHistBody"></tbody>
    </table></div>
  `;
  document.getElementById("bnBulan").value=String(now.getMonth()+1);
  document.getElementById("bnTahun").value=String(now.getFullYear());

  function renderPool(){
    const unitKey=document.getElementById("bnUnit").value;
    const year=parseInt(document.getElementById("bnTahun").value,10);
    const m=parseInt(document.getElementById("bnBulan").value,10);
    const info=computeBonusPool(unitKey,year,m);
    document.getElementById("bnPoolCard").innerHTML = info.target<=0
      ? `<div style="font-size:12.5px;color:var(--muted);">Belum ada target omzet untuk ${unitLabel(unitKey)} bulan ${MONTH_NAMES[m-1]} ${year} — atur target lewat aplikasi Keuangan (halaman Target & Bonus) dulu.</div>`
      : `<div class="grid3">
          <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">Target</div><div style="font-weight:700;">${formatRupiah(info.target)}</div></div>
          <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">Realisasi</div><div style="font-weight:700;">${formatRupiah(info.realisasi)}</div></div>
          <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">Pencapaian</div><div style="font-weight:700;">${info.pct.toFixed(1)}%</div></div>
        </div>
        <div style="margin-top:10px;font-size:13px;font-weight:700;color:var(--moss-dark);">Total Bonus Pool (${info.bonusPct}% dari omzet): ${formatRupiah(info.bonusPool)}</div>`;
    return info;
  }
  function renderKaryawanBonusForm(){
    const unitKey=document.getElementById("bnUnit").value;
    const daftar=KARYAWAN.filter(k=>k.status==="aktif" && k.unitKey===unitKey).sort((a,b)=>a.nama.localeCompare(b.nama));
    document.getElementById("bnBody").innerHTML = daftar.length ? daftar.map(k=>`
      <tr data-karyawan="${k.id}">
        <td style="text-align:left;">${escapeHtml(k.nama)}</td>
        <td style="text-align:left;">${escapeHtml(k.jabatan||"-")}</td>
        <td><div class="input-money" style="max-width:150px;margin-left:auto;"><span>Rp</span><input type="text" inputmode="numeric" class="money" data-bonus-input="${k.id}" placeholder="0"></div></td>
      </tr>`).join("") : `<tr><td colspan="3" class="empty-state">Belum ada karyawan aktif di unit ini.</td></tr>`;
    document.getElementById("bnFoot").innerHTML=`<td colspan="2">Total Dibagikan</td><td>Rp 0</td>`;
    document.querySelectorAll("[data-bonus-input]").forEach(inp=>{
      inp.addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; recalcBonusTotal(); });
    });
  }
  function recalcBonusTotal(){
    let total=0; document.querySelectorAll("[data-bonus-input]").forEach(inp=>{ total+=parseMoneyInput(inp.value); });
    document.querySelector("#bnFoot td:nth-child(2)").textContent=formatRupiah(total);
  }
  function renderHist(){
    const rows=[...BONUS].sort((a,b)=>b.tanggalBayar.localeCompare(a.tanggalBayar));
    document.getElementById("bnHistBody").innerHTML = rows.length ? rows.map(b=>`
      <tr>
        <td class="rowdate">${b.tanggalBayar}</td>
        <td>${escapeHtml(karyawanLabel(b.karyawanId))}</td>
        <td>${escapeHtml(unitLabel(b.unitKey))}</td>
        <td>${b.bulan}</td>
        <td>${formatRupiah(b.jumlah)}</td>
        <td><button class="btn btn-danger btn-sm" data-delbonus="${b.id}">Hapus</button></td>
      </tr>`).join("") : `<tr><td colspan="6" class="empty-state">Belum ada riwayat.</td></tr>`;
    document.querySelectorAll("[data-delbonus]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(await customConfirm("Hapus catatan bonus ini?","Ya, Hapus")){
          BONUS=BONUS.filter(x=>x.id!==btn.getAttribute("data-delbonus"));
          await saveBonus(); renderHist(); showToast("Dihapus");
        }
      });
    });
  }
  function refreshAll(){ renderPool(); renderKaryawanBonusForm(); }
  document.getElementById("bnUnit").addEventListener("change", refreshAll);
  document.getElementById("bnTahun").addEventListener("change", refreshAll);
  document.getElementById("bnBulan").addEventListener("change", refreshAll);
  document.getElementById("bnBagiRata").addEventListener("click", ()=>{
    const info=renderPool();
    const inputs=document.querySelectorAll("[data-bonus-input]");
    if(!inputs.length){ showToast("Belum ada karyawan aktif di unit ini"); return; }
    const bagian=Math.floor(info.bonusPool/inputs.length);
    inputs.forEach(inp=>{ inp.value=bagian?bagian.toLocaleString("id-ID"):""; });
    recalcBonusTotal();
    showToast(`Dibagi rata ke ${inputs.length} karyawan`);
  });
  document.getElementById("bnSimpan").addEventListener("click", async ()=>{
    const unitKey=document.getElementById("bnUnit").value;
    const year=document.getElementById("bnTahun").value;
    const m=String(document.getElementById("bnBulan").value).padStart(2,"0");
    const bulan=`${year}-${m}`;
    let count=0;
    document.querySelectorAll("[data-bonus-input]").forEach(inp=>{
      const karyawanId=inp.getAttribute("data-bonus-input");
      const jumlah=parseMoneyInput(inp.value);
      if(!jumlah) return;
      const existing=BONUS.find(b=>b.karyawanId===karyawanId && b.bulan===bulan && b.unitKey===unitKey);
      if(existing){ existing.jumlah=jumlah; } else { BONUS.push({ id:uid(), karyawanId, unitKey, bulan, jumlah, tanggalBayar:todayStr() }); }
      count++;
    });
    if(!count){ showToast("Belum ada jumlah bonus diisi"); return; }
    const ok=await saveBonus();
    document.getElementById("bnStatus").textContent = ok ? `Tersimpan · ${new Date().toLocaleTimeString("id-ID")}` : "Gagal tersimpan — coba lagi";
    renderHist();
    showToast(ok ? "Bonus tersimpan" : "Gagal menyimpan");
  });
  refreshAll(); renderHist();
}

/* ================= INIT ================= */
async function loadAppData(){
  const [unitRows, kasRows, targetRows, karyawanRows, gajiRows, bonusRows] = await Promise.all([
    sheetsGetAll(SHEET_UNIT), sheetsGetAll(SHEET_KAS_MASUK), sheetsGetAll(SHEET_TARGET_OMZET),
    sheetsGetAll(SHEET_KARYAWAN), sheetsGetAll(SHEET_GAJI), sheetsGetAll(SHEET_BONUS)
  ]);
  UNITS = unitRows && unitRows.length ? unitsFromRows(unitRows) : [];
  PEMASUKAN_RAW = kasRows||[];
  TARGET_OMZET = targetOmzetFromRows(targetRows||[], UNITS);
  KARYAWAN = karyawanFromRows(karyawanRows||[], UNITS);
  GAJI = gajiFromRows(gajiRows||[], KARYAWAN);
  BONUS = bonusFromRows(bonusRows||[], KARYAWAN, UNITS);

  buildNav();
  document.getElementById("signedInAs").textContent = signedInEmail || "";
  document.getElementById("btnSignOut").addEventListener("click", googleSignOut);
}

async function initApp(){
  await initGoogleAuth();
  buildNav();
  document.getElementById("loadingOverlay").style.display="none";
  document.getElementById("appShell").style.display="flex";
  navigateTo("sampul");

  document.getElementById("btnHamburger").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
  });
  document.getElementById("sidebarOverlay").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
  });
}
initApp();
</script>
