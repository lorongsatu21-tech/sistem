    </table></div>
    <button class="btn btn-ghost btn-sm" id="bnBagiRata">Bagi Rata Saja (tanpa mempertimbangkan level/masa kerja)</button>
    <button class="btn btn-primary" id="bnSimpan" style="margin-left:8px;">Simpan Pembayaran Bonus</button>
    <span id="bnStatus" style="font-size:12px;color:var(--muted);margin-left:10px;"></span>

    <div class="section-title" style="margin-top:26px;">Riwayat Pembayaran Bonus <span style="font-weight:400;color:var(--muted);font-size:12px;">(semua unit, unit terpilih disorot)</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Karyawan</th><th>Unit</th><th>Bulan</th><th>Jumlah</th><th></th></tr></thead>
      <tbody id="bnHistBody"></tbody>
    </table></div>
  `;
  document.getElementById("bnBulan").value=String(now.getMonth()+1);
  document.getElementById("bnTahun").value=String(now.getFullYear());

  function renderBanding(){
    const year=parseInt(document.getElementById("bnTahun").value,10);
    const m=parseInt(document.getElementById("bnBulan").value,10);
    const utama=findUnitByNamaMirip("Lorongsatu21");
    if(!utama){ document.getElementById("bnBandingCard").innerHTML=""; return; }
    const infoUtama=computeBonusPool(utama.key, year, m);
    const infoLain=computeBonusPool("__LAINNYA__", year, m);
    const unitLain=UNITS.filter(u=>u.key!==utama.key);
    document.getElementById("bnBandingCard").innerHTML = `
      <div class="section-title" style="font-size:12.5px;margin-bottom:4px;">Perbandingan Realisasi Omzet &amp; Bonus — ${MONTH_NAMES[m-1]} ${year}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Total Bonus Keseluruhan (semua unit): <b style="color:var(--moss-dark);">${formatRupiah(infoUtama.totalBonusPool)}</b> — dibagi ke bawah ini sesuai porsi omzet masing-masing</div>
      <div class="grid2">
        <div style="border-left:3px solid ${unitColor(utama.key)};padding-left:10px;">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">${escapeHtml(utama.label)}</div>
          <div style="font-weight:700;font-size:16px;color:${unitColor(utama.key)};">${formatRupiah(infoUtama.realisasi)}</div>
          <div style="font-size:10px;color:var(--muted);">${(infoUtama.porsi*100).toFixed(1)}% dari omzet total</div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px;">Bagian Bonus</div>
          <div style="font-weight:700;font-size:14px;color:var(--moss-dark);">${formatRupiah(infoUtama.bonusPool)}</div>
        </div>
        <div style="border-left:3px solid var(--line);padding-left:10px;">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">Gabungan Unit Lain (${unitLain.map(u=>u.label).join(", ")||"-"})</div>
          <div style="font-weight:700;font-size:16px;">${formatRupiah(infoLain.realisasi)}</div>
          <div style="font-size:10px;color:var(--muted);">${(infoLain.porsi*100).toFixed(1)}% dari omzet total</div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px;">Bagian Bonus</div>
          <div style="font-weight:700;font-size:14px;color:var(--moss-dark);">${formatRupiah(infoLain.bonusPool)}</div>
        </div>
      </div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:10px;">Angka "Bagian Bonus" ini yang akan dibagikan ke karyawan masing-masing kelompok — pilih "${escapeHtml(utama.label)}" atau "Unit Lain (Gabungan)" di dropdown Unit di atas untuk membagikannya.</div>
    `;
  }
  function renderPool(){
    const unitKey=document.getElementById("bnUnit").value;
    const unitLabelText = unitKey==="__LAINNYA__" ? "Unit Lain (Gabungan)" : (unitKey ? unitLabel(unitKey) : "Semua Unit");
    const year=parseInt(document.getElementById("bnTahun").value,10);
    const m=parseInt(document.getElementById("bnBulan").value,10);
    const info=computeBonusPool(unitKey,year,m);
    document.getElementById("bnPoolCard").innerHTML = info.totalTarget<=0
      ? `<div style="font-size:12.5px;color:var(--muted);">Belum ada Target Omzet "Semua Unit" untuk bulan ${MONTH_NAMES[m-1]} ${year} — Total Bonus Keseluruhan dihitung dari target gabungan semua unit ini. Atur dulu lewat aplikasi Keuangan (halaman Target & Bonus, pilih "Semua Unit").</div>`
      : `<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;">
          Total Bonus Keseluruhan (semua unit, ${info.bonusPct}% dari omzet gabungan): <b style="color:var(--moss-dark);">${formatRupiah(info.totalBonusPool)}</b>
          <span style="display:block;font-size:10.5px;">Target Rp${info.totalTarget.toLocaleString('id-ID')} · Realisasi Rp${info.totalRealisasi.toLocaleString('id-ID')} · Pencapaian ${info.totalPct.toFixed(1)}%</span>
        </div>
        <div style="border-top:1px dashed var(--line);padding-top:8px;">
          <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;">Porsi untuk: <span style="color:${(unitKey&&unitKey!=="__LAINNYA__")?unitColor(unitKey):'var(--moss-dark)'};">${escapeHtml(unitLabelText)}</span></div>
          <div class="grid3">
            <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">Realisasi Omzet</div><div style="font-weight:700;">${formatRupiah(info.realisasi)}</div></div>
            <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">Porsi dari Omzet Total</div><div style="font-weight:700;">${(info.porsi*100).toFixed(1)}%</div></div>
            <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;">Bagian Bonus</div><div style="font-weight:700;">${formatRupiah(info.bonusPool)}</div></div>
          </div>
          <div style="margin-top:8px;font-size:13px;font-weight:700;color:var(--moss-dark);">Total Bonus Pool untuk dibagikan: ${formatRupiah(info.bonusPool)}</div>
        </div>`;
    return info;
  }
  function currentBulan(){
    const year=document.getElementById("bnTahun").value;
    const m=String(document.getElementById("bnBulan").value).padStart(2,"0");
    return `${year}-${m}`;
  }
  function renderKaryawanBonusForm(){
    const bulan=currentBulan();
    const daftar=[...KARYAWAN].filter(k=>k.status==="aktif" && k.ikutBonus!==false).sort((a,b)=>{
      const ua=unitLabel(a.unitKey), ub=unitLabel(b.unitKey);
      return ua.localeCompare(ub) || a.nama.localeCompare(b.nama);
    });
    document.getElementById("bnBody").innerHTML = daftar.length ? daftar.map(k=>{
      const existing=BONUS.find(b=>b.karyawanId===k.id && b.bulan===bulan && b.unitKey===k.unitKey);
      const val=existing?existing.jumlah:0;
      return `<tr data-karyawan="${k.id}" data-unit-key="${k.unitKey}">
        <td style="text-align:left;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${unitColor(k.unitKey)};margin-right:6px;vertical-align:middle;"></span>${escapeHtml(k.nama)}
          <div style="font-size:10px;color:var(--muted);margin-left:14px;">${escapeHtml(unitLabel(k.unitKey))}</div>
        </td>
        <td>${escapeHtml(k.levelKompetensi||"-")}</td>
        <td>${escapeHtml(masaKerjaText(k.tanggalMulaiKerja))}</td>
        <td><div class="input-money" style="max-width:150px;margin-left:auto;"><span>Rp</span><input type="text" inputmode="numeric" class="money" data-bonus-input="${k.id}" value="${val?val.toLocaleString('id-ID'):''}" placeholder="0"></div></td>
      </tr>`;
    }).join("") : `<tr><td colspan="4" class="empty-state">Belum ada karyawan aktif.</td></tr>`;
    document.getElementById("bnFoot").innerHTML=`<td colspan="3">Total Dibagikan (semua unit)</td><td>Rp 0</td>`;
    document.querySelectorAll("[data-bonus-input]").forEach(inp=>{
      inp.addEventListener("input", e=>{ const v=parseMoneyInput(e.target.value); e.target.value=v?v.toLocaleString("id-ID"):""; recalcBonusTotal(); });
    });
    highlightBonusRows(document.getElementById("bnUnit").value);
    recalcBonusTotal();
  }
  function highlightBonusRows(selectedUnitKey){
    const activeKeys=unitsInSelection(selectedUnitKey);
    document.querySelectorAll("#bnBody tr[data-unit-key]").forEach(tr=>{
      const uk=tr.getAttribute("data-unit-key");
      if(!selectedUnitKey || activeKeys.includes(uk)){
        const col=unitColor(uk);
        tr.style.background=col+"1c"; tr.style.borderLeft=`3px solid ${col}`;
      } else {
        tr.style.background=""; tr.style.borderLeft="";
      }
    });
  }
  function recalcBonusTotal(){
    let total=0; document.querySelectorAll("[data-bonus-input]").forEach(inp=>{ total+=parseMoneyInput(inp.value); });
    document.querySelector("#bnFoot td:nth-child(2)").textContent=formatRupiah(total);
  }
  function renderHist(){
    const rows=[...BONUS].sort((a,b)=>b.tanggalBayar.localeCompare(a.tanggalBayar));
    const selectedUnit=document.getElementById("bnUnit").value;
    const activeKeys=unitsInSelection(selectedUnit);
    document.getElementById("bnHistBody").innerHTML = rows.length ? rows.map(b=>{
      const hl = !selectedUnit || activeKeys.includes(b.unitKey);
      const color = unitColor(b.unitKey);
      const style = hl ? ` style="background:${color}22;border-left:3px solid ${color};"` : '';
      return `
      <tr class="${hl?'bonus-row-hl':''}"${style}>
        <td class="rowdate">${b.tanggalBayar}</td>
        <td>${escapeHtml(karyawanLabel(b.karyawanId))}</td>
        <td>${escapeHtml(unitLabel(b.unitKey))}</td>
        <td>${b.bulan}</td>
        <td>${formatRupiah(b.jumlah)}</td>
        <td><button class="btn btn-danger btn-sm" data-delbonus="${b.id}">Hapus</button></td>
      </tr>`;
    }).join("") : `<tr><td colspan="6" class="empty-state">Belum ada riwayat.</td></tr>`;
    document.querySelectorAll("[data-delbonus]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(await customConfirm("Hapus catatan bonus ini?","Ya, Hapus")){
          BONUS=BONUS.filter(x=>x.id!==btn.getAttribute("data-delbonus"));
          await saveBonus(); renderHist(); showToast("Dihapus");
        }
      });
    });
  }
  function refreshAll(){ renderPool(); renderBanding(); renderKaryawanBonusForm(); renderHist(); }
  document.getElementById("bnUnit").addEventListener("change", refreshAll);
  document.getElementById("bnTahun").addEventListener("change", refreshAll);
  document.getElementById("bnBulan").addEventListener("change", refreshAll);
  function updateBobotNote(){
    const bl=parseFloat(document.getElementById("bnBobotLevel").value)||0;
    const bm=parseFloat(document.getElementById("bnBobotMasaKerja").value)||0;
    const sum=bl+bm;
    const note=document.getElementById("bnBobotNote");
    note.textContent = `Total bobot: ${sum}%`;
    note.style.color = sum===100 ? "var(--moss-dark)" : "var(--danger)";
    return sum===100;
  }
  document.getElementById("bnBobotLevel").addEventListener("input", updateBobotNote);
  document.getElementById("bnBobotMasaKerja").addEventListener("input", updateBobotNote);
  updateBobotNote();

  document.getElementById("bnBagiOtomatis").addEventListener("click", ()=>{
    if(!updateBobotNote()){ showToast("Total bobot harus tepat 100%"); return; }
    const info=renderPool();
    const unitKey=document.getElementById("bnUnit").value;
    const unitLabelText = unitKey==="__LAINNYA__" ? "Unit Lain (Gabungan)" : (unitKey ? unitLabel(unitKey) : "Semua Unit");
    const activeKeys=unitsInSelection(unitKey);
    const daftar=KARYAWAN.filter(k=>k.status==="aktif" && k.ikutBonus!==false && activeKeys.includes(k.unitKey));
    if(!daftar.length){ showToast("Belum ada karyawan aktif"); return; }
    const wLevel=(parseFloat(document.getElementById("bnBobotLevel").value)||0)/100;
    const wMasa=(parseFloat(document.getElementById("bnBobotMasaKerja").value)||0)/100;

    const levels=daftar.map(k=>Number(k.levelKompetensi)||0);
    const masaBulan=daftar.map(k=>masaKerjaBulanCount(k.tanggalMulaiKerja));
    const sumLevel=levels.reduce((s,v)=>s+v,0);
    const sumMasa=masaBulan.reduce((s,v)=>s+v,0);

    daftar.forEach((k,idx)=>{
      const propLevel = sumLevel>0 ? levels[idx]/sumLevel : 1/daftar.length;
      const propMasa = sumMasa>0 ? masaBulan[idx]/sumMasa : 1/daftar.length;
      const score = wLevel*propLevel + wMasa*propMasa;
      const bagian = Math.round(info.bonusPool * score);
      const inp = document.querySelector(`[data-bonus-input="${k.id}"]`);
      if(inp) inp.value = bagian?bagian.toLocaleString("id-ID"):"";
    });
    recalcBonusTotal();
    showToast(`Dibagi otomatis (${wLevel*100}% Level, ${wMasa*100}% Masa Kerja) ke ${daftar.length} karyawan ${unitLabelText}`);
  });
  document.getElementById("bnBagiRata").addEventListener("click", ()=>{
    const info=renderPool();
    const unitKey=document.getElementById("bnUnit").value;
    const unitLabelText = unitKey==="__LAINNYA__" ? "Unit Lain (Gabungan)" : (unitKey ? unitLabel(unitKey) : "Semua Unit");
    const activeKeys=unitsInSelection(unitKey);
    const inputs = [...document.querySelectorAll("#bnBody tr[data-unit-key]")]
      .filter(tr=>activeKeys.includes(tr.getAttribute("data-unit-key")))
      .map(tr=>tr.querySelector("[data-bonus-input]"))
      .filter(Boolean);
    if(!inputs.length){ showToast("Belum ada karyawan aktif"); return; }
    const bagian=Math.floor(info.bonusPool/inputs.length);
    inputs.forEach(inp=>{ inp.value=bagian?bagian.toLocaleString("id-ID"):""; });
    recalcBonusTotal();
    showToast(`Dibagi rata ke ${inputs.length} karyawan ${unitLabelText}`);
  });
  document.getElementById("bnSimpan").addEventListener("click", async ()=>{
    const bulan=currentBulan();
    let count=0;
    document.querySelectorAll("#bnBody tr[data-karyawan]").forEach(tr=>{
      const karyawanId=tr.getAttribute("data-karyawan");
      const unitKey=tr.getAttribute("data-unit-key");
      const inp=tr.querySelector("[data-bonus-input]");
      const jumlah=parseMoneyInput(inp.value);
      if(!jumlah) return;
      const existing=BONUS.find(b=>b.karyawanId===karyawanId && b.bulan===bulan && b.unitKey===unitKey);
      if(existing){ existing.jumlah=jumlah; } else { BONUS.push({ id:uid(), karyawanId, unitKey, bulan, jumlah, tanggalBayar:todayStr() }); }
      count++;
    });
    if(!count){ showToast("Belum ada jumlah bonus diisi"); return; }
    const ok=await saveBonus();
    document.getElementById("bnStatus").textContent = ok ? `Tersimpan · ${new Date().toLocaleTimeString("id-ID")}` : "Gagal tersimpan — coba lagi";
    renderHist();
    showToast(ok ? "Bonus tersimpan" : "Gagal menyimpan");
  });
  refreshAll(); renderHist();
}

/* ================= INIT ================= */
async function loadAppData(){
  const [unitRows, kasRows, lainRows, targetRows, karyawanRows, gajiRows, bonusRows, tarifRows, plafonRows] = await Promise.all([
    sheetsGetAll(SHEET_UNIT), sheetsGetAll(SHEET_KAS_MASUK), sheetsGetAll(SHEET_PEMASUKAN_LAIN), sheetsGetAll(SHEET_TARGET_OMZET),
    sheetsGetAll(SHEET_KARYAWAN), sheetsGetAll(SHEET_GAJI), sheetsGetAll(SHEET_BONUS), sheetsGetAll(SHEET_TARIF_JABATAN), sheetsGetAll(SHEET_PLAFON_GAJI)
  ]);
  UNITS = unitRows && unitRows.length ? unitsFromRows(unitRows) : [];
  PEMASUKAN_RAW = kasRows||[];
  PEMASUKAN_LAIN_RAW = lainRows||[];
  TARGET_OMZET = targetOmzetFromRows(targetRows||[], UNITS);
  KARYAWAN = karyawanFromRows(karyawanRows||[], UNITS);
  PLAFON_GAJI = plafonGajiFromRows(plafonRows||[]);
  NEXT_KARYAWAN_ID = nextIdCounterFromRows(karyawanRows||[]);
  GAJI = gajiFromRows(gajiRows||[], KARYAWAN);
  BONUS = bonusFromRows(bonusRows||[], KARYAWAN, UNITS);
  const tarifParsed = tarifJabatanFromRows(tarifRows||[]);
  TARIF_JABATAN = tarifParsed.list.length ? tarifParsed.list : CONTOH_TARIF_JABATAN.map(t=>({nama:t.nama, kelipatan:t.kelipatan}));
  NILAI_BASIS = tarifParsed.basis || (tarifParsed.list.length ? 0 : 100);

  // Penyembuhan otomatis: samakan jabatan karyawan yang mirip (beda spasi/kapital) ke nama resmi di Tarif Jabatan
  KARYAWAN.forEach(k=>{
    if(!k.jabatan) return;
    const kNorm = normalizeJabatanName(k.jabatan);
    const canonical = TARIF_JABATAN.find(t=>normalizeJabatanName(t.nama)===kNorm);
    if(canonical && canonical.nama!==k.jabatan) k.jabatan = canonical.nama;
  });

  buildNav();
  document.getElementById("signedInAs").textContent = signedInEmail || "";
  document.getElementById("btnSignOut").addEventListener("click", googleSignOut);
}

async function initApp(){
  await initGoogleAuth();
  buildNav();
  document.getElementById("loadingOverlay").style.display="none";
  document.getElementById("appShell").style.display="flex";
  navigateTo("sampul");

  document.getElementById("btnHamburger").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
  });
  document.getElementById("sidebarOverlay").addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
  });
}
initApp();
</script>
