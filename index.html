<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORONGSATU21 — Aplikasi</title>
<style>
  :root{
    --ink:#1f2a24; --paper:#f6f4ee; --paper-2:#ffffff; --line:#e2ddce;
    --moss:#3d5c46; --moss-dark:#2a4132; --muted:#7c7768;
    --shadow:0 1px 2px rgba(21,36,32,.06), 0 6px 18px rgba(21,36,32,.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;padding:0 0 60px;}
  .topbar{background:var(--moss-dark);color:#f2efe4;padding:28px 24px 24px;}
  .topbar-inner{max-width:760px;margin:0 auto;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c9d6c9;font-weight:700;}
  h1{margin:6px 0 0;font-size:24px;font-weight:700;}
  .wrap{max-width:760px;margin:28px auto 0;padding:0 24px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}
  .card{
    display:block;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    padding:18px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(21,36,32,.14);}
  .card .name{font-size:16px;font-weight:700;color:var(--moss-dark);margin-bottom:4px;}
  .card .desc{font-size:12.5px;color:var(--muted);}
  .card.disabled{opacity:.45;pointer-events:none;}
  .footer{max-width:760px;margin:32px auto 0;padding:0 24px;font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="eyebrow">LORONGSATU21</div>
      <h1>Daftar Aplikasi</h1>
    </div>
  </div>
  <div class="wrap">
    <div class="grid">
      <a class="card" href="./keuangan/">
        <div class="name">💰 Keuangan</div>
        <div class="desc">Kas masuk, pengeluaran, kantong kas, rekap & analisis per unit</div>
      </a>
      <a class="card disabled" href="./kasir/">
        <div class="name">🧾 Kasir</div>
        <div class="desc">Segera hadir</div>
      </a>
      <a class="card disabled" href="./kasir-jasa/">
        <div class="name">🛠️ Kasir Jasa</div>
        <div class="desc">Segera hadir</div>
      </a>
      <a class="card disabled" href="./karyawan/">
        <div class="name">👥 Karyawan</div>
        <div class="desc">Segera hadir</div>
      </a>
    </div>
  </div>
  <div class="footer">lorongsatu21-apps · dikelola lewat GitHub Pages</div>
</body>
</html>
